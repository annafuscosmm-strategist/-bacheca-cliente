<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Verace Studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Outfit:wght@400;500;600;700&family=Caveat:wght@700&display=swap">
<style>
/* Minimal editorial palette. Layout: header · [preview | tabbed panel] · timeline. */
:root{
  --bg:#F4F0E8; --panel:#FFFFFF; --panel2:#FAF6EE; --fg:#26221D; --muted:#948b7c;
  --line:#ece5d7; --line2:#ddd3c0; --accent:#9A7633; --accent2:#A8636A; --ink:#26221D;
  --danger:#B14b46; --ok:#4a7d5c; --stage:#1b1713; --chip:#f1ebdd;
  --shadow:0 1px 2px rgba(60,45,25,.05),0 8px 24px -16px rgba(60,45,25,.3);
  --r:14px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#16130f; --panel:#1f1b16; --panel2:#262118; --fg:#EDE6D6; --muted:#9a9082;
  --line:#2c271f; --line2:#3a342a; --accent:#DCC188; --accent2:#CE8D97; --ink:#EDE6D6;
  --danger:#d9706b; --ok:#72ad87; --stage:#0f0c09; --chip:#2a251d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -16px rgba(0,0,0,.6); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#16130f; --panel:#1f1b16; --panel2:#262118; --fg:#EDE6D6; --muted:#9a9082;
  --line:#2c271f; --line2:#3a342a; --accent:#DCC188; --accent2:#CE8D97; --ink:#EDE6D6;
  --danger:#d9706b; --ok:#72ad87; --stage:#0f0c09; --chip:#2a251d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -16px rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:'Outfit',system-ui,sans-serif;margin:0;min-height:100%;font-size:14px}
.app{display:flex;flex-direction:column;gap:12px;max-width:1360px;margin:0 auto;min-height:100%;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:14px}
h1,h2,h3,h4{margin:0;font-weight:600}
.serif{font-family:'Fraunces',Georgia,serif;font-weight:600}
button{font-family:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--panel);color:var(--fg);
  padding:8px 13px;border-radius:10px;font-weight:600;font-size:13px;transition:.14s;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.accent{background:var(--fg);border-color:var(--fg);color:var(--panel)}
.btn.accent:hover{opacity:.9}
.btn.gold{background:var(--accent);border-color:var(--accent);color:#1c1708}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);background:var(--panel2)}
.btn.danger{color:#fff;background:var(--danger);border-color:var(--danger)}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.ico{width:16px;height:16px;flex:0 0 auto}

.bar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 14px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:11px;margin-right:auto}
.logo{width:36px;height:36px;border-radius:10px;border:1px solid var(--line2);display:grid;place-items:center;color:var(--accent);font-family:'Fraunces',serif;font-weight:600;font-size:20px}
.brand b{font-size:17px;letter-spacing:.2px;font-family:'Fraunces',serif;font-weight:600}
.brand span{display:block;font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.2em;text-transform:uppercase}
.divv{width:1px;height:22px;background:var(--line2);margin:0 3px}

.main{display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:12px;align-items:start}
.stage-wrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:13px;align-items:center}
.stage{position:relative;background:var(--stage);border-radius:12px;overflow:hidden;width:100%;max-width:min(54vh,320px);aspect-ratio:9/16;display:grid;place-items:center;touch-action:none}
.stage canvas{width:100%;height:100%;display:block;cursor:grab}
.drop{position:absolute;inset:14px;border:1.5px dashed var(--line2);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;color:var(--muted);padding:18px}
.drop h3{color:var(--fg);font-size:15px}.drop p{font-size:12px;margin:0;max-width:220px;line-height:1.5}
.transport{display:flex;align-items:center;gap:10px;width:100%;max-width:min(54vh,320px)}
.transport .time{font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted);font-weight:600;min-width:90px}
.play{width:44px;height:44px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;border:1px solid var(--line2);background:var(--panel);color:var(--fg)}
.play:hover{border-color:var(--accent)}
.play .ico{width:19px;height:19px}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;min-height:470px}
.tabs{display:flex;gap:1px;padding:4px 8px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:none;background:transparent;color:var(--muted);font-weight:600;font-size:12.5px;padding:10px 9px;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:.12s}
.tab:hover{color:var(--fg)}
.tab.on{color:var(--fg);border-bottom-color:var(--accent)}
.pane{padding:16px;display:none;flex-direction:column;gap:13px;overflow:auto;max-height:66vh}
.pane.on{display:flex}
.sec-t{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.hint{color:var(--muted);font-size:12.5px;line-height:1.55}

.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vibe{border:1px solid var(--line2);border-radius:11px;padding:9px;cursor:pointer;transition:.14s;background:var(--panel);display:flex;flex-direction:column;gap:6px;text-align:left}
.vibe:hover{border-color:var(--accent)}
.vibe.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.vibe .sw{height:30px;border-radius:7px}
.vibe b{font-size:13px;font-weight:600}.vibe span{font-size:10px;color:var(--muted)}

.ref{border:1px dashed var(--line2);border-radius:11px;padding:11px;display:flex;gap:11px;align-items:center}
.ref img{width:38px;height:68px;object-fit:cover;border-radius:7px;background:var(--stage);flex:0 0 auto}

.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;display:flex;justify-content:space-between}
input[type=range]{width:100%;accent-color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
textarea,select,input[type=text],input[type=number]{font-family:inherit;background:var(--panel2);color:var(--fg);border:1px solid var(--line2);border-radius:9px;padding:9px 11px;font-size:13.5px;width:100%}
textarea{resize:vertical;min-height:52px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--panel);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600;cursor:pointer}
.chip.on{background:var(--fg);border-color:var(--fg);color:var(--panel)}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw2{width:26px;height:26px;border-radius:7px;border:2px solid transparent;cursor:pointer;position:relative}
.sw2.on{border-color:var(--fg)}
.toggle{display:flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden}
.toggle button{flex:1;border:none;background:var(--panel);color:var(--fg);padding:8px;font-weight:600;font-size:12.5px}
.toggle button.on{background:var(--fg);color:var(--panel)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line2);border-radius:10px;padding:10px 12px}
.switch b{font-size:13px;font-weight:600}.switch span{font-size:11px;color:var(--muted);display:block}
.sw-t{width:40px;height:23px;border-radius:999px;background:var(--line2);position:relative;flex:0 0 auto;transition:.15s;border:none;cursor:pointer}
.sw-t::after{content:"";position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:#fff;transition:.15s}
.sw-t.on{background:var(--accent)}.sw-t.on::after{left:19px}

.bank{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bcard{border:1px solid var(--line2);border-radius:11px;padding:10px;background:var(--panel);display:flex;flex-direction:column;gap:7px;transition:.14s;text-align:left}
.bcard:hover{border-color:var(--accent)}
.bcard .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--panel2);color:var(--accent)}
.bcard b{font-size:12.5px;font-weight:600}.bcard .d{font-size:10px;color:var(--muted)}
.bcard.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.soundlist{display:flex;flex-direction:column;gap:6px}
.srow{display:flex;align-items:center;gap:9px;border:1px solid var(--line2);border-radius:10px;padding:7px 10px;background:var(--panel)}
.srow .nm{flex:1;min-width:0}.srow .nm b{font-size:12.5px;display:block;font-weight:600}.srow .nm span{font-size:10px;color:var(--muted)}
.iconbtn{width:29px;height:29px;border-radius:8px;border:1px solid var(--line2);background:var(--panel);display:grid;place-items:center;color:var(--fg);flex:0 0 auto}
.logos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.logocell{aspect-ratio:1;border:1px solid var(--line2);border-radius:10px;background:var(--panel2);display:grid;place-items:center;position:relative;overflow:hidden;cursor:pointer}
.logocell img{max-width:80%;max-height:80%;object-fit:contain}
.logocell .x{position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;border:none;font-size:11px;display:grid;place-items:center}
.logocell.add{color:var(--muted);font-size:22px}

.chatlog{flex:1;overflow:auto;display:flex;flex-direction:column;gap:9px;padding:2px;min-height:210px}
.msg{max-width:90%;padding:9px 12px;border-radius:13px;font-size:13px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.msg.me{align-self:flex-end;background:var(--fg);color:var(--panel);border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--panel2);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.ai .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.msg.sys{align-self:center;color:var(--muted);font-size:11px;text-align:center}
.msg img.att{max-width:120px;border-radius:8px;margin-bottom:6px;display:block}
.typing{align-self:flex-start;color:var(--muted);font-size:12px;padding:4px 8px}
.chatbar{display:flex;gap:7px;padding-top:10px;border-top:1px solid var(--line);margin-top:8px;align-items:flex-end}
.chatbar textarea{min-height:38px;max-height:110px}
.attchip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:3px 6px;font-size:11px;margin-bottom:6px}
.attchip img{width:22px;height:22px;object-fit:cover;border-radius:4px}

.tl{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:9px}
.tlbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.tlbar .sp{margin-left:auto}
.zoom{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:12px;font-weight:600}
.tracks{position:relative;overflow-x:auto;overflow-y:hidden;border:1px solid var(--line);border-radius:11px;background:var(--panel2)}
.tlinner{position:relative;min-width:100%}
.ruler{position:relative;height:22px;border-bottom:1px solid var(--line);background:var(--panel2)}
.ruler .tick{position:absolute;top:0;height:100%;border-left:1px solid var(--line);font-size:9.5px;color:var(--muted);padding-left:4px;font-variant-numeric:tabular-nums;user-select:none}
.track{position:relative;height:48px;border-bottom:1px dashed var(--line);cursor:pointer}
.track:last-child{border-bottom:none}
.tlabel{position:absolute;left:7px;top:5px;font-size:9px;font-weight:700;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;pointer-events:none;background:var(--panel);padding:2px 6px;border-radius:5px;z-index:3;border:1px solid var(--line)}
.taddr{position:absolute;right:7px;top:7px;font-size:10.5px;font-weight:600;color:var(--accent);z-index:3;pointer-events:none}
.clip{position:absolute;top:6px;bottom:6px;border-radius:7px;overflow:hidden;cursor:grab;border:2px solid transparent;user-select:none}
.clip .cl-t{position:absolute;inset:0;display:flex;align-items:center;padding:0 8px 0 10px;font-size:11px;font-weight:600;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.55);pointer-events:none;white-space:nowrap;overflow:hidden}
.clip.sel{border-color:#fff;box-shadow:0 0 0 2px var(--accent)}
.clip .h{position:absolute;top:0;bottom:0;width:10px;cursor:ew-resize;z-index:2}
.clip .h.l{left:0}.clip .h.r{right:0}
.clip.vid{background:#5a7392}.clip.aud{background:#55866a}.clip.txt{background:var(--accent2)}.clip.img{background:#8a7a4e}
.playhead{position:absolute;top:0;bottom:0;width:2px;background:var(--danger);z-index:6;pointer-events:none}
.playhead::before{content:"";position:absolute;top:0;left:-5px;border:6px solid transparent;border-top-color:var(--danger)}
.note{font-size:11px;color:var(--muted);line-height:1.5}
.kbd{font:600 11px ui-monospace,monospace;background:var(--chip);border:1px solid var(--line2);border-radius:5px;padding:1px 5px}
input[type=file]{display:none}

.modal{position:fixed;inset:0;background:rgba(20,14,10,.5);display:grid;place-items:center;z-index:50;padding:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;max-width:560px;width:100%;box-shadow:var(--shadow);max-height:86vh;overflow:auto}
.card h2{font-size:18px;margin-bottom:8px;font-family:'Fraunces',serif;font-weight:600}
.card pre{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:11px;max-height:230px;overflow:auto;white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,monospace}
.mbody{display:flex;flex-direction:column;gap:2px;max-height:56vh;overflow:auto}
.litem{display:flex;gap:11px;align-items:center;padding:8px;border:1px solid var(--line2);border-radius:11px;margin-bottom:8px}
.lthumb{width:44px;height:78px;object-fit:cover;border-radius:7px;background:var(--stage);flex:0 0 auto}
.lmeta{flex:1;min-width:0}.lmeta b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lmeta span{font-size:11px;color:var(--muted)}
.lacts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.empty-note{color:var(--muted);font-size:13px;text-align:center;padding:22px 8px;line-height:1.6}
.styprev{width:38px;height:38px;border-radius:8px;flex:0 0 auto;display:grid;place-items:center;font-weight:700;border:1px solid var(--line2)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:10px;font-weight:600;font-size:13px;z-index:60;box-shadow:var(--shadow);opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1}
.hidden{display:none!important}
.tpl{border:1px solid var(--line2);border-radius:11px;padding:10px 11px;cursor:pointer;transition:.14s;background:var(--panel);display:flex;align-items:center;gap:10px;text-align:left;width:100%}
.tpl:hover{border-color:var(--accent)}
.tpl .ti{width:34px;height:34px;border-radius:9px;flex:0 0 auto;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px}
.tpl b{font-size:13.5px;font-weight:600;display:block}.tpl span{font-size:11px;color:var(--muted)}

@media (max-width:900px){.main{grid-template-columns:1fr}}
@media (max-width:640px){
  body{font-size:13.5px}
  .app{padding-block:9px;gap:9px}
  .bar{padding:8px 10px;gap:5px;border-radius:14px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
  .brand{gap:8px;margin-right:4px}.brand b{font-size:15px}.brand span{display:none}.logo{width:32px;height:32px;font-size:17px}
  .bar .btn{padding:8px 9px;font-size:12px;min-height:38px}
  .bar .divv{display:none}
  .stage{max-height:44vh;max-width:88vw;width:auto}.transport{max-width:88vw}
  .stage-wrap{padding:11px}
  .panel{min-height:unset}
  .pane{padding:13px;max-height:none}
  .tabs{position:sticky;top:0;background:var(--panel);z-index:5}
  .tab{padding:11px 12px;font-size:13px}
  .modal{padding:10px;align-items:flex-end}.card{padding:16px;border-radius:16px;max-height:92vh}
  .vgrid,.bank{grid-template-columns:1fr 1fr}
  .logos{grid-template-columns:repeat(4,1fr)}
  .btn{min-height:40px}
  .track{height:46px}
  .tl{padding:10px}
  textarea,select,input[type=text],input[type=number]{font-size:16px}
  .lthumb{width:40px;height:71px}
}
@media (max-width:400px){.vgrid{grid-template-columns:1fr}.bank{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app" id="app">
  <div class="bar">
    <div class="brand"><div class="logo">V</div><div><b>Verace Studio</b><span>Editor reel</span></div></div>
    <button class="btn ghost sm" id="saveProjBtn" title="Salva progetto"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 3h12l2 2v16H5zM8 3v6h7V3M8 21v-7h8v7"/></svg>Salva</button>
    <button class="btn ghost sm" id="projBtn">Progetti</button>
    <button class="btn ghost sm" id="libBtn">Libreria</button>
    <button class="btn ghost sm" id="stylesBtn2">Stili</button>
    <span class="divv"></span>
    <button class="btn ghost sm" id="themeBtn" title="Tema"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"/></svg></button>
    <button class="btn ghost sm" id="helpBtn">Guida</button>
    <button class="btn ghost sm" id="undoBtn" disabled><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
    <label class="btn" for="videoFile"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>Carica</label>
    <button class="btn gold" id="autoBtn" title="Montaggio automatico"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l1.8 4.2L18 9l-4.2 1.8L12 15l-1.8-4.2L6 9l4.2-1.8zM19 14l.9 2.1L22 17l-2.1.9L19 20l-.9-2.1L16 17l2.1-.9z"/></svg>Monta con AI</button>
    <button class="btn accent" id="exportBtn"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 15V3M8 7l4-4 4 4M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>Esporta</button>
  </div>

  <div class="main">
    <div class="stage-wrap">
      <div class="stage empty" id="stage">
        <canvas id="canvas" width="540" height="960" class="hidden"></canvas>
        <div class="drop" id="drop"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 15V3M8 7l4-4 4 4M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>
          <h3>Carica il tuo video</h3><p>Trascina qui un file verticale, poi premi «Monta con AI» per un primo montaggio automatico.</p>
          <label class="btn accent" for="videoFile">Scegli video</label></div>
      </div>
      <div class="transport">
        <button class="play" id="playBtn" title="Play/Pausa"><svg class="ico" id="playIco" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
