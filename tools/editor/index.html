<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Verace Studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Outfit:wght@400;500;600;700&family=Caveat:wght@700&display=swap">
<style>
/* Minimal editorial palette. Layout: header · [preview | tabbed panel] · timeline. */
:root{
  --bg:#F4F0E8; --panel:#FFFFFF; --panel2:#FAF6EE; --fg:#26221D; --muted:#948b7c;
  --line:#ece5d7; --line2:#ddd3c0; --accent:#9A7633; --accent2:#A8636A; --ink:#26221D;
  --danger:#B14b46; --ok:#4a7d5c; --stage:#1b1713; --chip:#f1ebdd;
  --shadow:0 1px 2px rgba(60,45,25,.05),0 8px 24px -16px rgba(60,45,25,.3);
  --r:14px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#16130f; --panel:#1f1b16; --panel2:#262118; --fg:#EDE6D6; --muted:#9a9082;
  --line:#2c271f; --line2:#3a342a; --accent:#DCC188; --accent2:#CE8D97; --ink:#EDE6D6;
  --danger:#d9706b; --ok:#72ad87; --stage:#0f0c09; --chip:#2a251d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -16px rgba(0,0,0,.6); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#16130f; --panel:#1f1b16; --panel2:#262118; --fg:#EDE6D6; --muted:#9a9082;
  --line:#2c271f; --line2:#3a342a; --accent:#DCC188; --accent2:#CE8D97; --ink:#EDE6D6;
  --danger:#d9706b; --ok:#72ad87; --stage:#0f0c09; --chip:#2a251d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -16px rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:'Outfit',system-ui,sans-serif;margin:0;min-height:100%;font-size:14px}
.app{display:flex;flex-direction:column;gap:12px;max-width:1360px;margin:0 auto;min-height:100%;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:14px}
h1,h2,h3,h4{margin:0;font-weight:600}
.serif{font-family:'Fraunces',Georgia,serif;font-weight:600}
button{font-family:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--panel);color:var(--fg);
  padding:8px 13px;border-radius:10px;font-weight:600;font-size:13px;transition:.14s;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.accent{background:var(--fg);border-color:var(--fg);color:var(--panel)}
.btn.accent:hover{opacity:.9}
.btn.gold{background:var(--accent);border-color:var(--accent);color:#1c1708}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);background:var(--panel2)}
.btn.danger{color:#fff;background:var(--danger);border-color:var(--danger)}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.ico{width:16px;height:16px;flex:0 0 auto}

.bar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 14px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:11px;margin-right:auto}
.logo{width:36px;height:36px;border-radius:10px;border:1px solid var(--line2);display:grid;place-items:center;color:var(--accent);font-family:'Fraunces',serif;font-weight:600;font-size:20px}
.brand b{font-size:17px;letter-spacing:.2px;font-family:'Fraunces',serif;font-weight:600}
.brand span{display:block;font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.2em;text-transform:uppercase}
.divv{width:1px;height:22px;background:var(--line2);margin:0 3px}

.main{display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:12px;align-items:start}
.stage-wrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:13px;align-items:center}
.stage{position:relative;background:var(--stage);border-radius:12px;overflow:hidden;width:100%;max-width:min(54vh,320px);aspect-ratio:9/16;display:grid;place-items:center;touch-action:none}
.stage canvas{width:100%;height:100%;display:block;cursor:grab}
.drop{position:absolute;inset:14px;border:1.5px dashed var(--line2);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;color:var(--muted);padding:18px}
.drop h3{color:var(--fg);font-size:15px}.drop p{font-size:12px;margin:0;max-width:220px;line-height:1.5}
.transport{display:flex;align-items:center;gap:10px;width:100%;max-width:min(54vh,320px)}
.transport .time{font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted);font-weight:600;min-width:90px}
.play{width:44px;height:44px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;border:1px solid var(--line2);background:var(--panel);color:var(--fg)}
.play:hover{border-color:var(--accent)}
.play .ico{width:19px;height:19px}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;min-height:470px}
.tabs{display:flex;gap:1px;padding:4px 8px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:none;background:transparent;color:var(--muted);font-weight:600;font-size:12.5px;padding:10px 9px;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:.12s}
.tab:hover{color:var(--fg)}
.tab.on{color:var(--fg);border-bottom-color:var(--accent)}
.pane{padding:16px;display:none;flex-direction:column;gap:13px;overflow:auto;max-height:66vh}
.pane.on{display:flex}
.sec-t{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.hint{color:var(--muted);font-size:12.5px;line-height:1.55}

.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vibe{border:1px solid var(--line2);border-radius:11px;padding:9px;cursor:pointer;transition:.14s;background:var(--panel);display:flex;flex-direction:column;gap:6px;text-align:left}
.vibe:hover{border-color:var(--accent)}
.vibe.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.vibe .sw{height:30px;border-radius:7px}
.vibe b{font-size:13px;font-weight:600}.vibe span{font-size:10px;color:var(--muted)}

.ref{border:1px dashed var(--line2);border-radius:11px;padding:11px;display:flex;gap:11px;align-items:center}
.ref img{width:38px;height:68px;object-fit:cover;border-radius:7px;background:var(--stage);flex:0 0 auto}

.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;display:flex;justify-content:space-between}
input[type=range]{width:100%;accent-color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
textarea,select,input[type=text],input[type=number]{font-family:inherit;background:var(--panel2);color:var(--fg);border:1px solid var(--line2);border-radius:9px;padding:9px 11px;font-size:13.5px;width:100%}
textarea{resize:vertical;min-height:52px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--panel);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600;cursor:pointer}
.chip.on{background:var(--fg);border-color:var(--fg);color:var(--panel)}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw2{width:26px;height:26px;border-radius:7px;border:2px solid transparent;cursor:pointer;position:relative}
.sw2.on{border-color:var(--fg)}
.toggle{display:flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden}
.toggle button{flex:1;border:none;background:var(--panel);color:var(--fg);padding:8px;font-weight:600;font-size:12.5px}
.toggle button.on{background:var(--fg);color:var(--panel)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line2);border-radius:10px;padding:10px 12px}
.switch b{font-size:13px;font-weight:600}.switch span{font-size:11px;color:var(--muted);display:block}
.sw-t{width:40px;height:23px;border-radius:999px;background:var(--line2);position:relative;flex:0 0 auto;transition:.15s;border:none;cursor:pointer}
.sw-t::after{content:"";position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:#fff;transition:.15s}
.sw-t.on{background:var(--accent)}.sw-t.on::after{left:19px}

.bank{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bcard{border:1px solid var(--line2);border-radius:11px;padding:10px;background:var(--panel);display:flex;flex-direction:column;gap:7px;transition:.14s;text-align:left}
.bcard:hover{border-color:var(--accent)}
.bcard .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--panel2);color:var(--accent)}
.bcard b{font-size:12.5px;font-weight:600}.bcard .d{font-size:10px;color:var(--muted)}
.bcard.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.soundlist{display:flex;flex-direction:column;gap:6px}
.srow{display:flex;align-items:center;gap:9px;border:1px solid var(--line2);border-radius:10px;padding:7px 10px;background:var(--panel)}
.srow .nm{flex:1;min-width:0}.srow .nm b{font-size:12.5px;display:block;font-weight:600}.srow .nm span{font-size:10px;color:var(--muted)}
.iconbtn{width:29px;height:29px;border-radius:8px;border:1px solid var(--line2);background:var(--panel);display:grid;place-items:center;color:var(--fg);flex:0 0 auto}
.logos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.logocell{aspect-ratio:1;border:1px solid var(--line2);border-radius:10px;background:var(--panel2);display:grid;place-items:center;position:relative;overflow:hidden;cursor:pointer}
.logocell img{max-width:80%;max-height:80%;object-fit:contain}
.logocell .x{position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;border:none;font-size:11px;display:grid;place-items:center}
.logocell.add{color:var(--muted);font-size:22px}

.chatlog{flex:1;overflow:auto;display:flex;flex-direction:column;gap:9px;padding:2px;min-height:210px}
.msg{max-width:90%;padding:9px 12px;border-radius:13px;font-size:13px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.msg.me{align-self:flex-end;background:var(--fg);color:var(--panel);border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--panel2);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.ai .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.msg.sys{align-self:center;color:var(--muted);font-size:11px;text-align:center}
.msg img.att{max-width:120px;border-radius:8px;margin-bottom:6px;display:block}
.typing{align-self:flex-start;color:var(--muted);font-size:12px;padding:4px 8px}
.chatbar{display:flex;gap:7px;padding-top:10px;border-top:1px solid var(--line);margin-top:8px;align-items:flex-end}
.chatbar textarea{min-height:38px;max-height:110px}
.attchip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:3px 6px;font-size:11px;margin-bottom:6px}
.attchip img{width:22px;height:22px;object-fit:cover;border-radius:4px}

.tl{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:9px}
.tlbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.tlbar .sp{margin-left:auto}
.zoom{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:12px;font-weight:600}
.tracks{position:relative;overflow-x:auto;overflow-y:hidden;border:1px solid var(--line);border-radius:11px;background:var(--panel2)}
.tlinner{position:relative;min-width:100%}
.ruler{position:relative;height:22px;border-bottom:1px solid var(--line);background:var(--panel2)}
.ruler .tick{position:absolute;top:0;height:100%;border-left:1px solid var(--line);font-size:9.5px;color:var(--muted);padding-left:4px;font-variant-numeric:tabular-nums;user-select:none}
.track{position:relative;height:48px;border-bottom:1px dashed var(--line);cursor:pointer}
.track:last-child{border-bottom:none}
.tlabel{position:absolute;left:7px;top:5px;font-size:9px;font-weight:700;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;pointer-events:none;background:var(--panel);padding:2px 6px;border-radius:5px;z-index:3;border:1px solid var(--line)}
.taddr{position:absolute;right:7px;top:7px;font-size:10.5px;font-weight:600;color:var(--accent);z-index:3;pointer-events:none}
.clip{position:absolute;top:6px;bottom:6px;border-radius:7px;overflow:hidden;cursor:grab;border:2px solid transparent;user-select:none}
.clip .cl-t{position:absolute;inset:0;display:flex;align-items:center;padding:0 8px 0 10px;font-size:11px;font-weight:600;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.55);pointer-events:none;white-space:nowrap;overflow:hidden}
.clip.sel{border-color:#fff;box-shadow:0 0 0 2px var(--accent)}
.clip .h{position:absolute;top:0;bottom:0;width:10px;cursor:ew-resize;z-index:2}
.clip .h.l{left:0}.clip .h.r{right:0}
.clip.vid{background:#5a7392}.clip.aud{background:#55866a}.clip.txt{background:var(--accent2)}.clip.img{background:#8a7a4e}
.playhead{position:absolute;top:0;bottom:0;width:2px;background:var(--danger);z-index:6;pointer-events:none}
.playhead::before{content:"";position:absolute;top:0;left:-5px;border:6px solid transparent;border-top-color:var(--danger)}
.note{font-size:11px;color:var(--muted);line-height:1.5}
.kbd{font:600 11px ui-monospace,monospace;background:var(--chip);border:1px solid var(--line2);border-radius:5px;padding:1px 5px}
input[type=file]{display:none}

.modal{position:fixed;inset:0;background:rgba(20,14,10,.5);display:grid;place-items:center;z-index:50;padding:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;max-width:560px;width:100%;box-shadow:var(--shadow);max-height:86vh;overflow:auto}
.card h2{font-size:18px;margin-bottom:8px;font-family:'Fraunces',serif;font-weight:600}
.card pre{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:11px;max-height:230px;overflow:auto;white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,monospace}
.mbody{display:flex;flex-direction:column;gap:2px;max-height:56vh;overflow:auto}
.litem{display:flex;gap:11px;align-items:center;padding:8px;border:1px solid var(--line2);border-radius:11px;margin-bottom:8px}
.lthumb{width:44px;height:78px;object-fit:cover;border-radius:7px;background:var(--stage);flex:0 0 auto}
.lmeta{flex:1;min-width:0}.lmeta b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lmeta span{font-size:11px;color:var(--muted)}
.lacts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.empty-note{color:var(--muted);font-size:13px;text-align:center;padding:22px 8px;line-height:1.6}
.styprev{width:38px;height:38px;border-radius:8px;flex:0 0 auto;display:grid;place-items:center;font-weight:700;border:1px solid var(--line2)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:10px;font-weight:600;font-size:13px;z-index:60;box-shadow:var(--shadow);opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1}
.hidden{display:none!important}
.tpl{border:1px solid var(--line2);border-radius:11px;padding:10px 11px;cursor:pointer;transition:.14s;background:var(--panel);display:flex;align-items:center;gap:10px;text-align:left;width:100%}
.tpl:hover{border-color:var(--accent)}
.tpl .ti{width:34px;height:34px;border-radius:9px;flex:0 0 auto;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px}
.tpl b{font-size:13.5px;font-weight:600;display:block}.tpl span{font-size:11px;color:var(--muted)}

@media (max-width:900px){.main{grid-template-columns:1fr}}
@media (max-width:640px){
  body{font-size:13.5px}
  .app{padding-block:9px;gap:9px}
  .bar{padding:8px 10px;gap:5px;border-radius:14px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
  .brand{gap:8px;margin-right:4px}.brand b{font-size:15px}.brand span{display:none}.logo{width:32px;height:32px;font-size:17px}
  .bar .btn{padding:8px 9px;font-size:12px;min-height:38px}
  .bar .divv{display:none}
  .stage{max-height:44vh;max-width:88vw;width:auto}.transport{max-width:88vw}
  .stage-wrap{padding:11px}
  .panel{min-height:unset}
  .pane{padding:13px;max-height:none}
  .tabs{position:sticky;top:0;background:var(--panel);z-index:5}
  .tab{padding:11px 12px;font-size:13px}
  .modal{padding:10px;align-items:flex-end}.card{padding:16px;border-radius:16px;max-height:92vh}
  .vgrid,.bank{grid-template-columns:1fr 1fr}
  .logos{grid-template-columns:repeat(4,1fr)}
  .btn{min-height:40px}
  .track{height:46px}
  .tl{padding:10px}
  textarea,select,input[type=text],input[type=number]{font-size:16px}
  .lthumb{width:40px;height:71px}
}
@media (max-width:400px){.vgrid{grid-template-columns:1fr}.bank{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app" id="app">
  <div class="bar">
    <div class="brand"><div class="logo">V</div><div><b>Verace Studio</b><span>Editor reel</span></div></div>
    <button class="btn ghost sm" id="saveProjBtn" title="Salva progetto"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 3h12l2 2v16H5zM8 3v6h7V3M8 21v-7h8v7"/></svg>Salva</button>
    <button class="btn ghost sm" id="projBtn">Progetti</button>
    <button class="btn ghost sm" id="libBtn">Libreria</button>
    <button class="btn ghost sm" id="stylesBtn2">Stili</button>
    <span class="divv"></span>
    <button class="btn ghost sm" id="themeBtn" title="Tema"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"/></svg></button>
    <button class="btn ghost sm" id="helpBtn">Guida</button>
    <button class="btn ghost sm" id="undoBtn" disabled><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
    <label class="btn" for="videoFile"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>Carica</label>
    <button class="btn gold" id="autoBtn" title="Montaggio automatico"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l1.8 4.2L18 9l-4.2 1.8L12 15l-1.8-4.2L6 9l4.2-1.8zM19 14l.9 2.1L22 17l-2.1.9L19 20l-.9-2.1L16 17l2.1-.9z"/></svg>Monta con AI</button>
    <button class="btn accent" id="exportBtn"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 15V3M8 7l4-4 4 4M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>Esporta</button>
  </div>

  <div class="main">
    <div class="stage-wrap">
      <div class="stage empty" id="stage">
        <canvas id="canvas" width="540" height="960" class="hidden"></canvas>
        <div class="drop" id="drop"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 15V3M8 7l4-4 4 4M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>
          <h3>Carica il tuo video</h3><p>Trascina qui un file verticale, poi premi «Monta con AI» per un primo montaggio automatico.</p>
          <label class="btn accent" for="videoFile">Scegli video</label></div>
      </div>
      <div class="transport">
        <button class="play" id="playBtn" title="Play/Pausa"><svg class="ico" id="playIco" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>

<script>
"use strict";
/* ============ Verace Studio — editor ibrido ============ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const uid=()=>Math.random().toString(36).slice(2,9);
const fmt=t=>{t=Math.max(0,t||0);const m=Math.floor(t/60),s=Math.floor(t%60),d=Math.floor((t*10)%10);return m+":"+String(s).padStart(2,"0")+"."+d;};
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),2200);}
function fmtDate(ms){try{return new Date(ms).toLocaleDateString("it-IT",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});}catch(e){return"";}}
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const PALETTE=["#FBF4E6","#2B2724","#C7A45E","#A8636A","#AC3F3F","#3E7A54","#E0C488","#F3E9D6"];
const FONTS=[["Outfit","Outfit"],["Fraunces","Fraunces"],["Caveat","Caveat"]];
const PRESETS={none:"Naturale",bw:"B/N",warm:"Caldo",cold:"Freddo",vivid:"Vivido",soft:"Soft"};
const SUBSTYLES={classico:{name:"Classico",font:"Outfit",color:"#FBF4E6",bold:true,box:null,size:28},box:{name:"Box scuro",font:"Outfit",color:"#FFFFFF",bold:true,box:"#2B2724",size:26},karaoke:{name:"Karaoke",font:"Outfit",color:"#E0C488",bold:true,box:null,size:34},pop:{name:"Pop rosso",font:"Outfit",color:"#FFFFFF",bold:true,box:"#AC3F3F",size:27},minimal:{name:"Minimal",font:"Outfit",color:"#FBF4E6",bold:false,box:null,size:24},elegante:{name:"Elegante",font:"Fraunces",color:"#F3E9D6",bold:false,box:null,size:30}};
const EMOJIS=["🎄","🎅","⛄","🦌","🎁","✨","❄️","🔔","⭐","😍","🔥","👇","💥","🤍","🧡","🎬"];

const S={src:null,segments:[],audios:[],overlays:[],playhead:0,playing:false,sel:null,pps:48,undo:[],
  projectId:null,projectName:"",projectCreatedAt:null,vibe:null,textStyle:{font:"Outfit",color:"#FBF4E6",bold:true},
  refThumb:null,refBlob:null,chat:[],_greeted:false,renderKaraoke:false,
  audioFx:{voice:false,noise:false},videoFx:{enhance:false},brand:{colors:[],font:null,logos:[]},chatAtt:null};
let AC=null,master=null,exportDest=null,vidSrcNode=null,vidGain=null,playingSources=[],vHP=null,vEQ=null,vComp=null;
let DL=null;const CAP={db:null,assets:null,user:null,sample:null,tts:null,ready:false,canWrite:true,sampleImages:false};
let activeTab="vibe",relinkTarget=null,subStyle="classico",exportRes=[1440,2560],capMode="frasi";
const imgCache={};
const canvas=$("#canvas"),ctx=canvas.getContext("2d");let CW=canvas.width,CH=canvas.height;
const stage=$("#stage"),tlinner=$("#tlinner"),ruler=$("#ruler"),playheadEl=$("#playheadEl");

/* ---- caps ---- */
async function initCaps(){
  if(window.claude&&claude.use){try{
    const [db,assets,user,dl,sample,tts]=await Promise.all([
      claude.use("db").catch(()=>null),claude.use("assets").catch(()=>null),claude.use("user").catch(()=>null),
      claude.use("downloads").catch(()=>null),claude.use("sample").catch(()=>null),claude.use("tts").catch(()=>null)]);
    CAP.db=db;CAP.assets=assets;CAP.user=user;DL=dl;CAP.sample=sample;CAP.tts=tts;CAP.ready=true;
    if(user){try{const w=await user.can("data.write");CAP.canWrite=(w!==false);}catch(e){}}
    if(sample){try{const lim=await sample.limits();CAP.sampleImages=!!(lim&&lim.images);}catch(e){}}
  }catch(e){}}
  updateStudioUI();await brandLoad();if(activeTab==="chat")ensureChat();
}
const cloudOn=()=>!!(CAP.db&&CAP.assets);

/* ---- mapping ---- */
const segDur=s=>s.out-s.in;
const total=()=>S.segments.reduce((a,s)=>a+segDur(s),0);
function segStart(i){let a=0;for(let k=0;k<i;k++)a+=segDur(S.segments[k]);return a;}
function locate(t){let a=0;for(let i=0;i<S.segments.length;i++){const d=segDur(S.segments[i]);if(t<a+d||i===S.segments.length-1)return{i,src:S.segments[i].in+clamp(t-a,0,d)};a+=d;}return null;}
function newSeg(i,o){return{id:uid(),in:i,out:o,eff:{bri:100,con:100,sat:100,scale:100,preset:"none"},fx:{},fi:0,fo:0};}

/* ---- undo ---- */
function snapshot(){try{S.undo.push(JSON.stringify({segments:S.segments,overlays:S.overlays.map(o=>({...o,_img:undefined})),vibe:S.vibe,textStyle:S.textStyle,

/* ---- filter ---- */
function filterFor(eff){let f=`brightness(${eff.bri}%) contrast(${eff.con}%) saturate(${eff.sat}%)`;if(eff.preset==="bw")f+=" grayscale(1)";else if(eff.preset==="warm")f+=" sepia(.35) saturate(135%) hue-rotate(-8deg)";else if(eff.preset==="cold")f+=" saturate(115%) hue-rotate(10deg) brightness(102%)";else if(eff.preset==="vivid")f+=" saturate(160%) contrast(108%)";else if(eff.preset==="soft")f+=" brightness(104%) contrast(94%) saturate(96%)";if(S.videoFx.enhance)f+=" contrast(108%) saturate(110%) brightness(102%)";return f;}

/* ---- FX ---- */
let noiseTile=null;function getNoise(){if(noiseTile)return noiseTile;const n=document.createElement("canvas");n.width=160;n.height=284;const g=n.getContext("2d"),d=g.createImageData(n.width,n.height);for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}g.putImageData(d,0,0);noiseTile=n;return n;}
function drawFx(fx,t,lt){if(fx.leak){ctx.save();ctx.globalCompositeOperation="screen";const cx=CW*(0.5+0.4*Math.sin(t*0.6)),cy=CH*(0.3+0.1*Math.cos(t*0.5));const g=ctx.createRadialGradient(cx,cy,0,cx,cy,CW*0.95);g.addColorStop(0,"rgba(224,196,136,.5)");g.addColorStop(.5,"rgba(172,63,63,.16)");g.addColorStop(1,"rgba(0,0,0,0)");ctx.fillStyle=g;ctx.fillRect(0,0,CW,CH);ctx.restore();}
  if(fx.grain){ctx.save();ctx.globalAlpha=0.07;ctx.globalCompositeOperation="overlay";ctx.drawImage(getNoise(),-(Math.random()*30),-(Math.random()*30),CW+30,CH+30);ctx.restore();}
  if(fx.snow){ctx.save();ctx.fillStyle="#fff";for(let i=0;i<46;i++){const sp=18+(i%7)*6,y=((t*sp+i*53)%(CH+30))-15,x=(i*71%CW)+Math.sin(t*0.8+i)*16,r=1+(i%3)*0.9;ctx.globalAlpha=.35+(i%5)/9;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();}ctx.restore();}
  if(fx.vignette){ctx.save();const g=ctx.createRadialGradient(CW/2,CH/2,CH*0.3,CW/2,CH/2,CH*0.63);g.addColorStop(0,"rgba(0,0,0,0)");g.addColorStop(1,"rgba(0,0,0,.5)");ctx.fillStyle=g;ctx.fillRect(0,0,CW,CH);ctx.restore();}
  if(fx.flash){const fl=Math.exp(-lt*7);if(fl>0.02){ctx.save();ctx.globalAlpha=Math.min(0.85,fl);ctx.fillStyle="#fff";ctx.fillRect(0,0,CW,CH);ctx.restore();}}}
function getImg(o){if(o._img)return o._img;const key=o.src;if(imgCache[key]){o._img=imgCache[key];return o._img;}const im=new Image();im.onload=()=>{if(!S.playing)drawFrame();};im.src=o.src;imgCache[key]=im;o._img=im;return im;}

/* ---- draw ---- */
function drawFrame(){CW=canvas.width;CH=canvas.height;ctx.clearRect(0,0,CW,CH);ctx.fillStyle="#141010";ctx.fillRect(0,0,CW,CH);
  const t=S.playhead,loc=S.src&&S.segments.length?locate(t):null;
  if(loc&&S.src){const seg=S.segments[loc.i],v=S.src.el,lt=t-segStart(loc.i),a=alphaAt(t,loc.i);let scale=Math.max(CW/S.src.w,CH/S.src.h)*(seg.eff.scale/100);if(seg.fx.zoom)scale*=1+0.14*Math.exp(-lt*5);let ox=0,oy=0;if(seg.fx.shake){ox=Math.sin(t*33)*CW*0.012;oy=Math.cos(t*39)*CH*0.012;}
    ctx.save();ctx.globalAlpha=a;ctx.filter=filterFor(seg.eff);const dw=S.src.w*scale,dh=S.src.h*scale;ctx.drawImage(v,(CW-dw)/2+ox,(CH-dh)/2+oy,dw,dh);ctx.restore();ctx.filter="none";ctx.globalAlpha=1;drawFx(seg.fx,t,lt);}
  for(const o of S.overlays){if(t<o.start||t>o.end)continue;
    if(o.kind==="image"){const im=getImg(o);if(im&&im.complete&&im.naturalWidth){const w=o.size/100*CW,h=w*im.naturalHeight/im.naturalWidth;ctx.save();ctx.shadowColor="rgba(0,0,0,.3)";ctx.shadowBlur=w*0.04;ctx.drawImage(im,o.x*CW-w/2,o.y*CH-h/2,w,h);ctx.restore();if(S.sel&&S.sel.kind==="overlay"&&S.sel.id===o.id){ctx.save();ctx.strokeStyle="#E0C488";ctx.lineWidth=2;ctx.setLineDash([6,5]);ctx.strokeRect(o.x*CW-w/2,o.y*CH-h/2,w,h);ctx.restore();}}continue;}
    ctx.save();const px=o.x*CW,py=o.y*CH,fs=o.size/100*CH*0.1+10;ctx.font=`${o.bold?"800":"600"} ${fs}px ${o.font},sans-serif`;ctx.textAlign="center";ctx.textBaseline="middle";const lines=(o.text||"").split("\n"),lh=fs*1.15;
    if(o.box){let mw=0;lines.forEach(ln=>{mw=Math.max(mw,ctx.measureText(ln).width);});const bw=mw+fs*0.8,bh=lh*lines.length+fs*0.4,bx=px-bw/2,by=py-bh/2,rr=fs*0.3;ctx.fillStyle=o.box;ctx.beginPath();ctx.moveTo(bx+rr,by);ctx.arcTo(bx+bw,by,bx+bw,by+bh,rr);ctx.arcTo(bx+bw,by+bh,bx,by+bh,rr);ctx.arcTo(bx,by+bh,bx,by,rr);ctx.arcTo(bx,by,bx+bw,by,rr);ctx.closePath();ctx.fill();}

function scheduleAudio(fromT){if(!AC)return;stopSources();const now=AC.currentTime;for(const c of S.audios){if(!c.buf)continue;const cd=c.out-c.in,endT=c.start+cd;if(endT<=fromT)continue;let offset=c.in,when=now+(c.start-fromT),dur=cd;if(c.start<fromT){offset=c.in+(fromT-c.start);when=now;dur=c.out-offset;}if(dur<=0)continue;const src=AC.createBufferSource();src.buffer=c.buf;const g=AC.createGain();g.gain.value=c.vol;src.connect(g);g.connect(master);try{src.start(Math.max(now,when),offset,dur);playingSources.push(src);}catch(e){}}}

function splitAtCore(t){const loc=locate(t);if(!loc)return false;const seg=S.segments[loc.i],srcT=loc.src;if(srcT<=seg.in+0.05||srcT>=seg.out-0.05)return false;const b=newSeg(srcT,seg.out);b.eff={...seg.eff};b.fx={...seg.fx};seg.out=srcT;seg.fo=0;b.fi=0;S.segments.splice(loc.i+1,0,b);return true;}

async function beatSyncCuts(){if(!S.src){toast("Carica prima un video");return;}const clip=S.audios.find(a=>a.sfx&&MUSIC[a.sfx])||S.audios.find(a=>a.buf);if(!clip||!clip.buf){toast("Aggiungi prima una musica dalla banca");return;}
  toast("Cerco il ritmo…");const buf=clip.buf,ch=buf.getChannelData(0),sr=buf.sampleRate,win=Math.max(1,Math.floor(sr*0.02)),n=Math.floor(buf.length/win);const en=new Float32Array(n);let mx=1e-6;

  if(beats.length<2){toast("Non trovo un ritmo chiaro in questa traccia");return;}
  snapshot();let cuts=0;beats.forEach(bt=>{if(bt>0.15&&bt<total()-0.15&&splitAtCore(bt))cuts++;});renderAll();toast(cuts+" tagli a tempo di musica");}

function renderOffline(dur,build){const sr=44100,OAC=window.OfflineAudioContext||window.webkitOfflineAudioContext;const oc=new OAC(2,Math.ceil(sr*dur),sr);build(oc,dur);return oc.startRendering();}
function tone(oc,freq,t,dur,vol,type){const o=oc.createOscillator();o.type=type||"sine";o.frequency.value=freq;const g=oc.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(oc.destination);o.start(t);o.stop(t+dur+0.05);}

async function addMusic(key){if(!S.src){toast("Carica prima un video");return;}ensureAudio();const dur=Math.min(Math.max(total(),6),60);try{const buf=await renderOffline(dur,MUSIC[key].build);snapshot();S.audios.push({id:uid(),name:MUSIC[key].name,buf,sfx:key,blob:null,assetId:null,start:0,in:0,out:buf.duration,vol:0.5,missing:false});renderTracks();select({kind:"audio",id:S.audios[S.audios.length-1].id});toast(MUSIC[key].name+" aggiunta");}catch(e){toast("Errore audio");}}
async function getSourceAudioBuffer(){if(S.src._abuf)return S.src._abuf;ensureAudio();let blob=S.src.blob;if(!blob){try{blob=await (await fetch(S.src.url)).blob();}catch(e){}}if(!blob)return null;try{const ab=await AC.decodeAudioData(await blob.arrayBuffer());S.src._abuf=ab;return ab;}catch(e){return null;}}
async function cutSilences(sens){if(!S.src){toast("Carica prima un video");return;}toast("Analizzo l'audio…");const ab=await getSourceAudioBuffer();if(!ab){toast("Nessun audio nel video");return;}
  const ch=ab.getChannelData(0),sr=ab.sampleRate,win=Math.max(1,Math.floor(sr*0.03)),n=Math.floor(ab.length/win);let peak=1e-6;const rms=new Float32Array(n);
  for(let i=0;i<n;i++){let s=0;const base=i*win;for(let j=0;j<win;j++){const v=ch[base+j]||0;s+=v*v;}const r=Math.sqrt(s/win);rms[i]=r;if(r>peak)peak=r;}
  const thr=peak*(0.03+(1-sens)*0.17),pad=0.08,minGap=0.18,minLen=0.3;let regions=[],start=null;
  for(let i=0;i<n;i++){if(rms[i]>=thr){if(start==null)start=i*win/sr;}else if(start!=null){regions.push([start,i*win/sr]);start=null;}}
  if(start!=null)regions.push([start,n*win/sr]);
  const merged=[];regions.forEach(r=>{r=[Math.max(0,r[0]-pad),Math.min(ab.duration,r[1]+pad)];if(merged.length&&r[0]-merged[merged.length-1][1]<minGap)merged[merged.length-1][1]=r[1];else merged.push(r);});
  const kept=merged.filter(r=>r[1]-r[0]>=minLen);
  if(!kept.length){toast("Tutto sotto soglia: abbassa la sensibilità");return;}
  snapshot();const preset=S.vibe?VIBES[S.vibe].grade.preset:"none",fx=S.vibe?{...VIBES[S.vibe].fx}:{};
  S.segments=kept.map(r=>({id:uid(),in:+r[0].toFixed(2),out:+Math.min(r[1],S.src.dur).toFixed(2),eff:{bri:100,con:100,sat:100,scale:100,preset},fx:{...fx},fi:0,fo:0}));
  S.sel=null;S.playhead=0;renderAll();seekTo(0);drawFrame();toast("Silenzi tagliati: "+kept.length+" clip · −"+(S.src.dur-total()).toFixed(1)+"s");}

async function applyMyTemplate(tpl){if(!S.src){toast("Carica prima un video");return;}snapshot();if(tpl.vibe)applyVibeCore(tpl.vibe);const T=total();S.overlays=S.overlays.filter(o=>o.kind==="image");(tpl.overlays||[]).forEach(o=>S.overlays.push({id:uid(),kind:"text",text:o.text,x:o.x,y:o.y,size:o.size,color:o.color,font:o.font,bold:o.bold,box:o.box||null,start:+(o.a*T).toFixed(2),end:+(o.b*T).toFixed(2)}));if(tpl.videoEnhance)S.videoFx.enhance=true;if(tpl.audioVoice){S.audioFx.voice=true;ensureAudio();setAudioFx();}if(tpl.sounds&&tpl.sounds.length){ensureAudio();for(const s of tpl.sounds){const gen=SFX[s.k]||MUSIC[s.k];if(!gen)continue;try{const d=gen.dur||Math.min(Math.max(T,6),60);const buf=await renderOffline(d,gen.build);S.audios.push({id:uid(),name:gen.name,buf,sfx:s.k,blob:null,assetId:null,start:+(s.a*T).toFixed(2),in:0,out:buf.duration,vol:gen.dur?0.85:0.5,missing:false});}catch(e){}}}if(tpl.vibe)S.vibe=tpl.vibe;S.sel=null;renderAll();drawFrame();toast("Modello «"+(tpl.name||"")+"» applicato");}
function noiseBuf(oc,dur){const sr=oc.sampleRate,n=Math.ceil(sr*dur),b=oc.createBuffer(1,n,sr),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;return b;}
const SFX={whoosh:{name:"Whoosh",d:"transizione",dur:0.7,build:oc=>{const s=oc.createBufferSource();s.buffer=noiseBuf(oc,0.7);const f=oc.createBiquadFilter();f.type="bandpass";f.frequency.setValueAtTime(400,0);f.frequency.exponentialRampToValueAtTime(3600,0.5);f.Q.value=0.8;const g=oc.createGain();g.gain.setValueAtTime(0.0001,0);g.gain.linearRampToValueAtTime(0.5,0.18);g.gain.exponentialRampToValueAtTime(0.001,0.7);s.connect(f);f.connect(g);g.connect(oc.destination);s.start(0);}},
  pop:{name:"Pop",d:"accento",dur:0.2,build:oc=>{const o=oc.createOscillator();o.type="sine";o.frequency.setValueAtTime(900,0);o.frequency.exponentialRampToValueAtTime(180,0.12);const g=oc.createGain();g.gain.setValueAtTime(0.5,0);g.gain.exponentialRampToValueAtTime(0.001,0.18);o.connect(g);g.connect(oc.destination);o.start(0);o.stop(0.2);}},
  ding:{name:"Ding",d:"notifica",dur:0.8,build:oc=>{[1319,1760].forEach((fq,i)=>{const o=oc.createOscillator();o.type="sine";o.frequency.value=fq;const g=oc.createGain();g.gain.setValueAtTime(i?0.18:0.35,0);g.gain.exponentialRampToValueAtTime(0.001,0.8);o.connect(g);g.connect(oc.destination);o.start(0);o.stop(0.8);});}},
  riser:{name:"Riser",d:"tensione",dur:1.1,build:oc=>{const s=oc.createBufferSource();s.buffer=noiseBuf(oc,1.1);const f=oc.createBiquadFilter();f.type="highpass";f.frequency.setValueAtTime(300,0);f.frequency.exponentialRampToValueAtTime(5000,1.0);const g=oc.createGain();g.gain.setValueAtTime(0.05,0);g.gain.linearRampToValueAtTime(0.5,1.0);g.gain.exponentialRampToValueAtTime(0.001,1.1);s.connect(f);f.connect(g);g.connect(oc.destination);s.start(0);}},
  boom:{name:"Boom",d:"impatto",dur:0.9,build:oc=>{const o=oc.createOscillator();o.type="sine";o.frequency.setValueAtTime(120,0);o.frequency.exponentialRampToValueAtTime(45,0.5);const g=oc.createGain();g.gain.setValueAtTime(0.9,0);g.gain.exponentialRampToValueAtTime(0.001,0.9);o.connect(g);g.connect(oc.destination);o.start(0);o.stop(0.9);}},
  swoosh:{name:"Swoosh",d:"transizione",dur:0.5,build:oc=>{const s=oc.createBufferSource();s.buffer=noiseBuf(oc,0.5);const f=oc.createBiquadFilter();f.type="highpass";f.frequency.setValueAtTime(1500,0);f.frequency.exponentialRampToValueAtTime(600,0.4);const g=oc.createGain();g.gain.setValueAtTime(0.4,0);g.gain.exponentialRampToValueAtTime(0.001,0.5);s.connect(f);f.connect(g);g.connect(oc.destination);s.start(0);}},
  click:{name:"Click",d:"tap",dur:0.08,build:oc=>{const s=oc.createBufferSource();s.buffer=noiseBuf(oc,0.08);const g=oc.createGain();g.gain.setValueAtTime(0.5,0);g.gain.exponentialRampToValueAtTime(0.001,0.07);s.connect(g);g.connect(oc.destination);s.start(0);}},
  shimmer:{name:"Shimmer",d:"magia",dur:1.0,build:oc=>{[2093,2637,3136].forEach((fq,i)=>{const o=oc.createOscillator();o.type="triangle";o.frequency.value=fq;const g=oc.createGain();g.gain.setValueAtTime(0.0001,0);g.gain.linearRampToValueAtTime(0.14,0.1+i*0.08);g.gain.exponentialRampToValueAtTime(0.001,1.0);o.connect(g);g.connect(oc.destination);o.start(i*0.05);o.stop(1.0);});}},
  sparkle:{name:"Sparkle",d:"brillio",dur:0.7,build:oc=>{for(let k=0;k<6;k++){const o=oc.createOscillator();o.type="sine";o.frequency.value=1800+Math.random()*2200;const g=oc.createGain(),st=k*0.08;g.gain.setValueAtTime(0.0001,st);g.gain.linearRampToValueAtTime(0.18,st+0.01);g.gain.exponentialRampToValueAtTime(0.001,st+0.15);o.connect(g);g.connect(oc.destination);o.start(st);o.stop(st+0.16);}}},
  heartbeat:{name:"Battito",d:"ritmo",dur:0.9,build:oc=>{[0,0.28].forEach(st=>{const o=oc.createOscillator();o.type="sine";o.frequency.setValueAtTime(90,st);o.frequency.exponentialRampToValueAtTime(50,st+0.14);const g=oc.createGain();g.gain.setValueAtTime(0.0001,st);g.gain.linearRampToValueAtTime(0.8,st+0.02);g.gain.exponentialRampToValueAtTime(0.001,st+0.2);o.connect(g);g.connect(oc.destination);o.start(st);o.stop(st+0.25);});}}};

function colorSet(){const set=[...S.brand.colors,...PALETTE];return set.filter((c,i)=>set.indexOf(c)===i).slice(0,16);}
function genCaptions(script){if(!S.src){toast("Carica prima un video");return 0;}const parts=(script||"").split(/\n|(?<=[.!?…])\s+/).map(s=>s.trim()).filter(Boolean);if(!parts.length)return 0;snapshot();const T=total(),per=T/parts.length,st=SUBSTYLES[subStyle];parts.forEach((txt,i)=>{S.overlays.push({id:uid(),kind:"text",text:txt.length>44?txt.slice(0,44)+"…":txt,x:0.5,y:0.74,size:st.size,color:st.color,font:st.font,bold:st.bold,box:st.box,start:+(i*per).toFixed(2),end:+((i+1)*per-0.05).toFixed(2)});});renderAll();drawFrame();return parts.length;}
function applySubStyleToSel(){const o=getSelObj();if(!o||!S.sel||S.sel.kind!=="overlay"||o.kind!=="text"){toast("Seleziona un testo");return;}snapshot();const st=SUBSTYLES[subStyle];o.color=st.color;o.font=st.font;o.bold=st.bold;o.box=st.box;o.size=st.size;renderText();drawFrame();toast("Stile sottotitolo applicato");}
function genKaraoke(script){if(!S.src){toast("Carica prima un video");return 0;}const words=(script||"").split(/\s+/).map(w=>w.trim()).filter(Boolean);if(!words.length)return 0;snapshot();const T=total(),st=SUBSTYLES[subStyle],groups=[];for(let i=0;i<words.length;i+=2)groups.push(words.slice(i,i+2).join(" "));const per=T/groups.length;groups.forEach((g,i)=>S.overlays.push({id:uid(),kind:"text",text:g,x:0.5,y:0.72,size:Math.max(st.size,32),color:st.color,font:st.font,bold:true,box:st.box,start:+(i*per).toFixed(2),end:+((i+1)*per).toFixed(2)}));renderAll();drawFrame();return groups.length;}

let AI_BACKEND=true;
async function aiComplete(prompt,opts){opts=opts||{};
  if(CAP.sample){const r=await CAP.sample(prompt,opts);return r.text||"";}
  let resp;try{resp=await fetch("/.netlify/functions/ai",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({prompt})});}catch(e){AI_BACKEND=false;throw{code:"no_backend"};}
  if(!resp.ok){AI_BACKEND=false;throw{code:"no_backend"};}
  const j=await resp.json();if(j.error){if(j.error==="no_key")throw{code:"no_key"};throw{code:j.error};}return j.text||"";}
async function askClaude(text){const att=S.chatAtt;pushMe(text||"(immagine)",att?att.dataUrl:null);const sendAtt=att;S.chatAtt=null;renderAttRow();
  typing(true);try{const hist=S.chat.slice(-8).map(m=>(m.role==="me"?"Anna: ":"Tu: ")+m.text).join("\n");
    const sys="Sei la direttrice creativa dello studio di Anna, social media manager dell'agenzia Marketing Verace. Aiuti a montare reel verticali. Rispondi SEMPRE in italiano, tono caldo e concreto, massimo 80 parole. Proponi elementi visivi: testi/hook da mostrare, effetti, vibe (elegante, creativo, minimal, energico, caldo, natalizio, cinema, dolce), ritmo. Le scritte da mettere nel video mettile tra «virgolette basse».";
    const ctx="Contesto: reel di "+fmt(total())+", "+S.segments.length+" clip, vibe: "+(S.vibe?VIBES[S.vibe].name:"nessuna")+(sendAtt?". Anna ha allegato un'immagine.":"") ;
    const opts={modelTier:"default"};if(CAP.sampleImages&&sendAtt&&sendAtt.blob)opts.images=[sendAtt.blob];
    const out=await aiComplete(sys+"\n\n"+ctx+"\n\nConversazione:\n"+hist+"\n\nRispondi all'ultimo messaggio.",opts);typing(false);pushAiParsed(out||"…");}
  catch(e){typing(false);const c=e&&e.code;pushAi(c==="no_key"?"La chat AI non è ancora collegata qui: va inserita la chiave AI nelle impostazioni del sito (te lo spiego io).":c==="no_backend"?"Qui la chat AI non è disponibile. Usa la versione su claude.ai, oppure collega la chiave AI al sito.":c==="rate_limited"?"Un attimo, troppe richieste — riprova tra poco.":"Non riesco a rispondere adesso.");}}

  canvas.width=res[0];canvas.height=res[1];drawFrame();
  const vstream=canvas.captureStream(30),stream=new MediaStream([...vstream.getVideoTracks(),...exportDest.stream.getAudioTracks()]);let rec;try{rec=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:bitr}:undefined);}catch(e){canvas.width=oldW;canvas.height=oldH;drawFrame();area.innerHTML=`<p class="note">Registrazione non disponibile. Usa «Copia il piano».</p>`;return;}
  const chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};recording=true;area.innerHTML=`<p class="note">Registrazione ${res[0]}×${res[1]}… <b id="exPct">0%</b> (resta su questa scheda)</p>`;pause();S.playhead=0;seekTo(0);drawFrame();const thumb=thumbDataUrl();
  rec.onstop=async()=>{recording=false;canvas.width=oldW;canvas.height=oldH;drawFrame();const blob=new Blob(chunks,{type:mime.split(";")[0]||"video/webm"}),ext=mime.includes("mp4")?"mp4":"webm",fn=(S.projectName||"verace-reel").replace(/[^\w\-]+/g,"-")+"."+ext,sizeMB=(blob.size/1048576).toFixed(1);
    if(sink==="library"){area.innerHTML=`<p class="note">Caricamento…</p>`;try{const up=await CAP.assets.upload(blob,{type:mime.includes("mp4")?"video/mp4":"video/webm"});await CAP.db.collection("exports").add({name:S.projectName||"Reel senza nome",assetId:up.id,ext,durationSec:+total().toFixed(1),sizeBytes:blob.size,thumb,createdAt:Date.now()});area.innerHTML=`<p class="note">✓ Salvato nella Libreria (${sizeMB} MB).</p>`;}catch(err){area.innerHTML=`<p class="note">${err&&err.code==="too_large"?"Supera 20 MB: accorcia il reel.":"Caricamento non riuscito."}</p>`;}return;}
    if(DL){try{await DL.save({filename:fn,data:blob});area.innerHTML=`<p class="note">✓ Video salvato (${sizeMB} MB). Per 1080×1920 usa «Copia il piano».</p>`;return;}catch(err){if(err&&err.code==="declined"){area.innerHTML=`<p class="note">Annullato.</p>`;return;}}}
    const url=URL.createObjectURL(blob);try{const a=document.createElement("a");a.href=url;a.download=fn;document.body.appendChild(a);a.click();a.remove();}catch(e){}area.innerHTML=`<p class="note">Video pronto (${sizeMB} MB). <a href="${url}" download="${fn}" class="btn gold sm">Scarica</a><br>Se non parte, apri l'editor come file sul tuo computer, o usa «Copia il piano».</p>`;};
  rec.start(200);await play();const tot=total();const watch=()=>{const pct=Math.min(100,Math.round(S.playhead/tot*100)),pe=m.querySelector("#exPct");if(pe)pe.textContent=pct+"%";if(!S.playing||S.playhead>=tot-0.05){try{rec.stop()}catch(e){}return;}requestAnimationFrame(watch);};requestAnimationFrame(watch);}
$("#exportBtn").addEventListener("click",openExport);

/* ============ STORAGE ============ */
function openModal(titleHtml){const m=document.createElement("div");m.className="modal";const card=document.createElement("div");card.className="card";card.innerHTML=`<h2>${titleHtml}</h2><div class="mbody"></div><div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn ghost" data-x>Chiudi</button></div>`;m.appendChild(card);m.addEventListener("click",ev=>{if(ev.target===m||ev.target.hasAttribute("data-x"))m.remove();});document.body.appendChild(m);return{m,body:card.querySelector(".mbody")};}
function infoModal(t,x){const{body}=openModal(t);body.innerHTML=`<p class="note">${x}</p>`;}
async function ensureSourceAsset(){if(S.src.assetId)return S.src.assetId;if(!S.src.blob)throw{code:"no_blob"};const t=(S.src.blob.type||"");const type=t.includes("webm")?"video/webm":(t.includes("mp4")?"video/mp4":"");if(!type)throw{code:"bad_type"};const up=await CAP.assets.upload(S.src.blob,{type});S.src.assetId=up.id;return up.id;}
async function saveProjectDoc(name){await ensureSourceAsset();S.projectName=name;const id=S.projectId||uid(),now=Date.now();const body={name,updatedAt:now,createdAt:S.projectCreatedAt||now,vibe:S.vibe,textStyle:S.textStyle,audioFx:S.audioFx,videoFx:S.videoFx,source:{assetId:S.src.assetId,w:S.src.w,h:S.src.h,dur:+S.src.dur.toFixed(3)},segments:S.segments.map(s=>({in:+s.in.toFixed(3),out:+s.out.toFixed(3),eff:s.eff,fx:s.fx,fi:s.fi,fo:s.fo})),overlays:S.overlays.map(o=>o.kind==="image"?{kind:"image",assetId:o.assetId,src:o.assetId?null:o.src,x:o.x,y:o.y,size:o.size,start:o.start,end:o.end}:{kind:o.kind,text:o.text,x:o.x,y:o.y,size:o.size,color:o.color,font:o.font,bold:o.bold,box:o.box||null,start:o.start,end:o.end}),audios:S.audios.map(a=>({name:a.name,sfx:a.sfx||null,start:a.start,in:a.in,out:a.out,vol:a.vol})),thumb:thumbDataUrl()};await CAP.db.collection("projects").doc(id).set(body);S.projectId=id;S.projectCreatedAt=body.createdAt;}
function loadProjectData(p,id){S.segments=[];S.audios=[];S.overlays=[];S.undo=[];$("#undoBtn").disabled=true;S.projectId=id;S.projectName=p.name;S.projectCreatedAt=p.createdAt;S.vibe=p.vibe||null;if(p.textStyle)S.textStyle=p.textStyle;if(p.audioFx)S.audioFx=p.audioFx;if(p.videoFx)S.videoFx=p.videoFx;S._greeted=true;
  loadVideoFromUrl("/_blob/"+p.source.assetId,"Progetto aperto: "+p.name,{assetId:p.source.assetId,silentGreet:true,after:()=>{S.segments=(p.segments||[]).map(s=>({id:uid(),in:s.in,out:s.out,eff:s.eff||{bri:100,con:100,sat:100,scale:100,preset:"none"},fx:s.fx||{},fi:s.fi||0,fo:s.fo||0}));if(!S.segments.length)S.segments=[newSeg(0,S.src.dur)];S.overlays=(p.overlays||[]).map(o=>o.kind==="image"?{id:uid(),kind:"image",assetId:o.assetId||null,src:o.assetId?("/_blob/"+o.assetId):o.src,x:o.x,y:o.y,size:o.size,start:o.start,end:o.end}:{...o,id:uid()});S.audios=(p.audios||[]).map(a=>({id:uid(),name:a.name,sfx:a.sfx||null,start:a.start,in:a.in,out:a.out,vol:a.vol,buf:null,blob:null,assetId:null,missing:!a.sfx}));},sfxRestore:async()=>{for(const a of S.audios){if(a.sfx){const gen=SFX[a.sfx]||MUSIC[a.sfx];if(gen){try{a.buf=await renderOffline(gen.dur||(a.out-a.in)||8,gen.build);a.missing=false;a.out=a.in+a.buf.duration;renderTracks();}catch(e){}}}}setAudioFx();}});}
function doSaveProject(){if(!cloudOn()){infoModal("Salva progetto","I progetti si salvano nella versione <b>online</b> (il link condivisibile).");return;}if(!CAP.canWrite){infoModal("Salva progetto","Hai accesso in sola lettura.");return;}if(!S.src){toast("Carica prima un video");return;}const{m,body}=openModal("Salva progetto");body.innerHTML=`<div class="field"><label><span>Nome del progetto</span></label><input type="text" id="pName" maxlength="60" value="${esc(S.projectName||"Reel senza nome")}"></div><button class="btn accent" id="pSave" style="margin-top:4px">Salva</button><p class="note" id="pMsg" style="margin-top:8px">Si salvano video, tagli, vibe, testi, grafiche ed effetti. (La musica caricata va riaggiunta; gli effetti sonori si rigenerano.)</p>`;body.querySelector("#pSave").onclick=async()=>{const name=(body.querySelector("#pName").value||"").trim()||"Reel senza nome",msg=body.querySelector("#pMsg");msg.textContent="Salvataggio… (carico il video)";try{await saveProjectDoc(name);msg.textContent="✓ Salvato";toast("Progetto salvato");setTimeout(()=>m.remove(),700);}catch(e){msg.textContent=e&&e.code==="bad_type"?"Serve MP4 o WebM (.mov non supportato).":(e&&e.code==="too_large"?"Il video supera 20 MB.":"Salvataggio non riuscito.");}};}
async function openProjects(){if(!cloudOn()){infoModal("Progetti","Disponibile nella versione <b>online</b> (link condivisibile).");return;}const{body}=openModal("Progetti");const mapFn=it=>{const acts=[`<button class="btn sm gold" data-a="open">Apri</button>`];if(CAP.canWrite)acts.push(`<button class="btn sm ghost" data-a="ren">Rinomina</button>`,`<button class="btn sm ghost danger" data-a="del">Elimina</button>`);return{thumb:it.thumb,title:it.name,sub:fmtDate(it.updatedAt),acts:acts.join("")};};const actFn=async(it,a,row)=>{if(a==="open"){document.querySelectorAll(".modal").forEach(x=>x.remove());loadProjectData(it,it.id);}else if(a==="del"){await CAP.db.collection("projects").doc(it.id).delete();row.remove();if(!body.querySelector(".litem"))refresh();toast("Eliminato");}else if(a==="ren"){promptInline(row,it.name,async v=>{await CAP.db.collection("projects").doc(it.id).update({name:v,updatedAt:Date.now()});it.name=v;toast("Rinominato");refresh();});}};async function refresh(){body.innerHTML=`<p class="note">Caricamento…</p>`;let list;try{const s=await CAP.db.collection("projects").orderBy("updatedAt","desc").limit(100).get();list=s.docs.map(d=>({id:d.id,...d.data()}));}catch(e){body.innerHTML=`<p class="empty-note">Impossibile leggere i progetti.</p>`;return;}renderList(body,list,"Nessun progetto salvato.<br>Monta un reel e premi «Salva».",mapFn,actFn);}refresh();}
async function openLibrary(){if(!cloudOn()){infoModal("Libreria","Disponibile nella versione <b>online</b> (link condivisibile).");return;}const{body}=openModal("Libreria video");body.innerHTML=`<p class="note">Caricamento…</p>`;let list;try{const s=await CAP.db.collection("exports").orderBy("createdAt","desc").limit(100).get();list=s.docs.map(d=>({id:d.id,...d.data()}));}catch(e){body.innerHTML=`<p class="empty-note">Impossibile leggere la libreria.</p>`;return;}renderList(body,list,"Nessun video salvato.<br>Esporta e scegli «Salva nella Libreria».",it=>{const acts=[`<button class="btn sm gold" data-a="play">Riproduci</button>`,`<button class="btn sm ghost" data-a="dl">Scarica</button>`];if(CAP.canWrite)acts.push(`<button class="btn sm ghost danger" data-a="del">Elimina</button>`);return{thumb:it.thumb,title:it.name,sub:fmtDate(it.createdAt)+" · "+(it.durationSec||0)+"s · "+((it.sizeBytes||0)/1048576).toFixed(1)+" MB",acts:acts.join("")};},async(it,a,row)=>{const url="/_blob/"+it.assetId;if(a==="play"){const{body:b2}=openModal("▶ "+esc(it.name));b2.innerHTML=`<video src="${url}" controls autoplay playsinline style="width:100%;max-width:300px;border-radius:12px;display:block;margin:0 auto;background:#000"></video>`;}else if(a==="dl"){try{const blob=await (await fetch(url)).blob(),fn=(it.name||"reel").replace(/[^\w\-]+/g,"-")+"."+(it.ext||"webm");if(DL){await DL.save({filename:fn,data:blob});toast("Scaricato");}else{const u=URL.createObjectURL(blob),x=document.createElement("a");x.href=u;x.download=fn;document.body.appendChild(x);x.click();x.remove();}}catch(e){toast("Download non riuscito");}}else if(a==="del"){await CAP.db.collection("exports").doc(it.id).delete();try{await CAP.assets.delete(it.assetId);}catch(e){}row.remove();toast("Eliminato");}});}
async function stylesList(){if(CAP.db){const s=await CAP.db.collection("styles").orderBy("createdAt","desc").limit(100).get();return s.docs.map(d=>({id:d.id,...d.data()}));}return LS.get("verace_styles",[]);}
async function styleSave(st){st.createdAt=Date.now();if(CAP.db&&CAP.canWrite){const r=await CAP.db.collection("styles").add(st);return r.id;}st.id=uid();const arr=LS.get("verace_styles",[]);arr.unshift(st);LS.set("verace_styles",arr);return st.id;}
async function styleDelete(id){if(CAP.db&&CAP.canWrite){try{await CAP.db.collection("styles").doc(id).delete();return;}catch(e){}}LS.set("verace_styles",LS.get("verace_styles",[]).filter(s=>s.id!==id));}
function styleFromSelection(){const o=getSelObj();if(!o||!S.sel)return null;if(S.sel.kind==="segment")return{kind:"look",data:{eff:{...o.eff},fx:{...o.fx},fi:o.fi,fo:o.fo}};if(S.sel.kind==="overlay"&&o.kind==="text")return{kind:"text",data:{color:o.color,font:o.font,bold:o.bold,size:o.size}};return null;}
function applyStyleObj(st){const o=getSelObj();if(!o){toast("Seleziona prima un elemento");return;}if(st.kind==="look"&&S.sel.kind==="segment"){snapshot();o.eff={...o.eff,...st.data.eff};if(st.data.fx)o.fx={...st.data.fx};o.fi=st.data.fi||0;o.fo=st.data.fo||0;renderPanel();drawFrame();renderTracks();toast("Stile applicato");}else if(st.kind==="text"&&S.sel.kind==="overlay"&&o.kind==="text"){snapshot();Object.assign(o,st.data);renderPanel();renderTracks();drawFrame();toast("Stile applicato");}else toast(st.kind==="look"?"Seleziona un clip video":"Seleziona un testo");}
function pcolor(eff){if(!eff)return"#888";if(eff.preset==="bw")return"#555";if(eff.preset==="warm")return"#b07a3a";if(eff.preset==="cold")return"#4a6b8a";if(eff.preset==="vivid")return"#AC3F3F";if(eff.preset==="soft")return"#9a8c76";return"#6b7e5a";}
async function openStyles(){const{body}=openModal("Stili salvati");const sel=styleFromSelection();const head=document.createElement("div");head.style.marginBottom="10px";if(sel)head.innerHTML=`<div class="field"><label><span>Salva stile dalla selezione (${sel.kind==="look"?"effetti del clip":"stile del testo"})</span></label><div class="row"><input type="text" id="stName" placeholder="Nome stile" maxlength="40" style="flex:1"><button class="btn gold sm" id="stSave">Salva</button></div></div>`;else head.innerHTML=`<p class="note">Seleziona un <b>clip video</b> o un <b>testo</b>, poi riapri qui.</p>`;body.appendChild(head);const listWrap=document.createElement("div");body.appendChild(listWrap);async function refresh(){let arr;try{arr=await stylesList();}catch(e){arr=[];}listWrap.innerHTML="";if(!arr.length){listWrap.innerHTML=`<p class="empty-note">Nessuno stile salvato.</p>`;return;}arr.forEach(st=>{const row=document.createElement("div");row.className="litem";const prev=st.kind==="look"?`<div class="styprev" style="background:${esc(pcolor(st.data.eff))};color:#fff">A</div>`:`<div class="styprev" style="background:${esc(st.data.color||'#888')};color:#2a2113;font-family:${esc(st.data.font||'Outfit')}">A</div>`;row.innerHTML=`${prev}<div class="lmeta"><b>${esc(st.name||"Stile")}</b><span>${st.kind==="look"?"Effetto video":"Stile testo"}</span></div><div class="lacts"><button class="btn sm gold" data-a="apply">Applica</button><button class="btn sm ghost danger" data-a="del">Elimina</button></div>`;row.querySelector('[data-a="apply"]').onclick=()=>applyStyleObj(st);row.querySelector('[data-a="del"]').onclick=async()=>{await styleDelete(st.id);row.remove();if(!listWrap.querySelector(".litem"))refresh();toast("Eliminato");};listWrap.appendChild(row);});}if(sel)head.querySelector("#stSave").onclick=async()=>{const name=(head.querySelector("#stName").value||"").trim()||(sel.kind==="look"?"Look":"Testo");try{await styleSave({name,kind:sel.kind,data:sel.data});toast("Stile salvato");head.querySelector("#stName").value="";refresh();}catch(e){toast("Salvataggio non riuscito");}};refresh();}
function renderList(body,list,emptyHtml,mapFn,actFn){body.innerHTML="";if(!list.length){body.innerHTML=`<p class="empty-note">${emptyHtml}</p>`;return;}list.forEach(it=>{const m=mapFn(it),row=document.createElement("div");row.className="litem";row.innerHTML=`<img class="lthumb" src="${m.thumb||""}" alt=""><div class="lmeta"><b>${esc(m.title)}</b><span>${esc(m.sub)}</span></div><div class="lacts">${m.acts}</div>`;row.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>actFn(it,b.dataset.a,row,body));body.appendChild(row);});}
function promptInline(row,val,onok){const meta=row.querySelector(".lmeta"),old=meta.innerHTML;meta.innerHTML=`<input type="text" value="${esc(val)}" style="width:100%" maxlength="60"> <button class="btn sm gold" style="margin-top:4px">OK</button>`;const inp=meta.querySelector("input");inp.focus();meta.querySelector("button").onclick=async()=>{const v=(inp.value||"").trim();if(v){try{await onok(v);}catch(e){}}meta.innerHTML=old;};}
function updateStudioUI(){const c=cloudOn();const set=(sel,on,tip)=>{const b=$(sel);if(b){b.disabled=!on;if(tip)b.title=on?"":tip;}};set("#saveProjBtn",c&&CAP.canWrite,"Disponibile online");set("#projBtn",c,"Disponibile online");set("#libBtn",c,"Disponibile online");}
$("#saveProjBtn").addEventListener("click",doSaveProject);$("#projBtn").addEventListener("click",openProjects);$("#libBtn").addEventListener("click",openLibrary);$("#stylesBtn2").addEventListener("click",openStyles);

function b64ToBlob(b64,type){const bin=atob(b64),len=bin.length,bytes=new Uint8Array(len);for(let i=0;i<len;i++)bytes[i]=bin.charCodeAt(i);return new Blob([bytes],{type});}
