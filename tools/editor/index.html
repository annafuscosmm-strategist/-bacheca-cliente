<meta name="claude:viewport-fit-sides" content="cover">
<title>Verace Studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,600;1,600;1,700&family=Caveat:wght@700&display=swap">
<style>
/* Layout: top bar · preview+properties row · timeline tracks below. Warm "studio" palette, theme-aware. */
:root{
  --bg:#EFE7D8; --panel:#FCF7EE; --panel2:#F5ECDC; --fg:#2B2724; --muted:#8a7f72;
  --line:#e3d8c3; --accent:#B98A3E; --accent-2:#A8636A; --danger:#AC3F3F; --ok:#3E7A54;
  --stage:#241f1c; --chip:#efe3cd; --shadow:0 6px 22px rgba(60,45,25,.14);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1f1b18; --panel:#2B2724; --panel2:#332e29; --fg:#F3E9D6; --muted:#a99e8f;
  --line:#3d372f; --accent:#E0C488; --accent-2:#C98893; --danger:#d46a6a; --ok:#6fae86;
  --stage:#141010; --chip:#3a342d; --shadow:0 8px 26px rgba(0,0,0,.45); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1f1b18; --panel:#2B2724; --panel2:#332e29; --fg:#F3E9D6; --muted:#a99e8f;
  --line:#3d372f; --accent:#E0C488; --accent-2:#C98893; --danger:#d46a6a; --ok:#6fae86;
  --stage:#141010; --chip:#3a342d; --shadow:0 8px 26px rgba(0,0,0,.45); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:'Outfit',system-ui,sans-serif;margin:0}
.app{display:flex;flex-direction:column;min-height:100%;max-width:1400px;margin:0 auto;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:12px;gap:12px}
h1,h2,h3{margin:0;font-weight:800;text-wrap:balance}
button{font-family:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);color:var(--fg);
  padding:9px 13px;border-radius:11px;font-weight:700;font-size:14px;transition:.12s;white-space:nowrap}
.btn:hover{border-color:var(--accent);transform:translateY(-1px)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#2a2113}
.btn.ghost{background:transparent}
.btn.danger{color:#fff;background:var(--danger);border-color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.ico{width:16px;height:16px;flex:0 0 auto}

/* top bar */
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);
  border-radius:16px;padding:10px 14px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.logo{width:34px;height:34px;border-radius:9px;background:
  linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;color:#2a2113;font-weight:800}
.brand b{font-size:17px;letter-spacing:.2px}
.brand span{display:block;font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.14em;text-transform:uppercase}

/* main row */
.main{display:grid;grid-template-columns:1fr 320px;gap:12px;align-items:start}
.stage-wrap{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:10px;align-items:center}
.stage{position:relative;background:var(--stage);border-radius:12px;overflow:hidden;width:100%;max-width:min(46vh,340px);
  aspect-ratio:9/16;display:grid;place-items:center;touch-action:none}
.stage canvas{width:100%;height:100%;display:block;cursor:grab}
.stage.empty::after{content:"Carica un video per iniziare";color:#b7ac9b;font-size:14px;padding:0 22px;text-align:center}
.transport{display:flex;align-items:center;gap:10px;width:100%;max-width:min(46vh,340px)}
.transport .time{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);font-weight:700;min-width:92px}
.play{width:44px;height:44px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;border:none;
  background:var(--accent);color:#2a2113}
.play .ico{width:19px;height:19px}

/* properties */
.props{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:12px;min-height:200px}
.props h3{font-size:14px;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.props .hint{color:var(--muted);font-size:12.5px;line-height:1.5}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.field input[type=range]{width:100%;accent-color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.val{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
textarea,select,input[type=text],input[type=number]{font-family:inherit;background:var(--panel2);color:var(--fg);
  border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:14px;width:100%}
textarea{resize:vertical;min-height:58px}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:24px;height:24px;border-radius:7px;border:2px solid transparent;cursor:pointer}
.sw.on{border-color:var(--fg)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:700;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#2a2113}
.seg-ctl{display:flex;gap:6px}
.toggle{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.toggle button{flex:1;border:none;background:var(--panel2);color:var(--fg);padding:7px;font-weight:700;font-size:13px}
.toggle button.on{background:var(--accent);color:#2a2113}

/* timeline */
.tl{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:9px}
.tlbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tlbar .sp{margin-left:auto}
.zoom{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;font-weight:700}
.tracks{position:relative;overflow-x:auto;overflow-y:hidden;border:1px solid var(--line);border-radius:11px;background:var(--panel2)}
.tlinner{position:relative;min-width:100%}
.ruler{position:relative;height:24px;border-bottom:1px solid var(--line);background:var(--panel2)}
.ruler .tick{position:absolute;top:0;height:100%;border-left:1px solid var(--line);font-size:10px;color:var(--muted);padding-left:4px;
  font-variant-numeric:tabular-nums;user-select:none}
.track{position:relative;height:var(--th);border-bottom:1px dashed var(--line)}
.track:last-child{border-bottom:none}
.track-lbl{position:sticky;left:0;z-index:4;float:left;width:0;height:0}
.tlabel{position:absolute;left:6px;top:5px;font-size:10px;font-weight:800;color:var(--muted);letter-spacing:.1em;
  text-transform:uppercase;pointer-events:none;background:var(--panel2);padding:1px 5px;border-radius:5px;z-index:3}
.clip{position:absolute;top:6px;bottom:6px;border-radius:8px;overflow:hidden;cursor:grab;border:2px solid transparent;
  user-select:none;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.clip .cl-t{position:absolute;inset:0;display:flex;align-items:center;padding:0 8px 0 10px;font-size:11.5px;font-weight:700;
  color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);pointer-events:none;white-space:nowrap;overflow:hidden}
.clip.sel{border-color:var(--fg)}
.clip .h{position:absolute;top:0;bottom:0;width:9px;cursor:ew-resize;z-index:2}
.clip .h.l{left:0}.clip .h.r{right:0}
.clip.vid{background:linear-gradient(135deg,#4a6b8a,#35506b)}
.clip.aud{background:linear-gradient(135deg,var(--ok),#2c5a3f)}
.clip.txt{background:linear-gradient(135deg,var(--accent-2),#7e4a50)}
.playhead{position:absolute;top:0;bottom:0;width:2px;background:var(--danger);z-index:6;pointer-events:none}
.playhead::before{content:"";position:absolute;top:0;left:-5px;border:6px solid transparent;border-top-color:var(--danger)}

.muted{color:var(--muted)}
.note{font-size:12px;color:var(--muted);line-height:1.5}
.hidden{display:none!important}
input[type=file]{display:none}

/* modal */
.modal{position:fixed;inset:0;background:rgba(20,14,10,.55);display:grid;place-items:center;z-index:50;padding:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;max-width:560px;width:100%;
  box-shadow:var(--shadow);max-height:86vh;overflow:auto}
.card h2{font-size:19px;margin-bottom:8px}
.card pre{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:11.5px;
  max-height:230px;overflow:auto;white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,monospace}
.bardrop{border:2px dashed var(--line);border-radius:12px;padding:20px;text-align:center;color:var(--muted);font-size:13px}
.kbd{font:600 11px ui-monospace,monospace;background:var(--chip);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--fg);color:var(--bg);
  padding:10px 16px;border-radius:10px;font-weight:700;font-size:13px;z-index:60;box-shadow:var(--shadow);opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1}

@media (max-width:860px){
  .main{grid-template-columns:1fr}
  .stage{max-width:min(60vh,300px)}
  .transport{max-width:min(60vh,300px)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app" id="app">
  <div class="bar">
    <div class="brand">
      <div class="logo">V</div>
      <div><b>Verace Studio</b><span>Editor reel</span></div>
    </div>
    <button class="btn ghost sm" id="themeBtn" title="Tema chiaro/scuro"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"/></svg></button>
    <button class="btn ghost sm" id="helpBtn">Guida</button>
    <button class="btn ghost sm" id="undoBtn" disabled><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>Annulla</button>
    <label class="btn" for="videoFile"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Carica video</label>
    <button class="btn accent" id="exportBtn"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15V3M8 7l4-4 4 4M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>Esporta</button>
  </div>

  <div class="main">
    <div class="stage-wrap">
      <div class="stage empty" id="stage"><canvas id="canvas" width="540" height="960" class="hidden"></canvas></div>
      <div class="transport">
        <button class="play" id="playBtn" title="Play/Pausa"><svg class="ico" id="playIco" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
        <span class="time" id="timeLbl">0:00 / 0:00</span>
        <div class="row" style="margin-left:auto;gap:6px">
          <button class="btn sm ghost" id="splitBtn" title="Taglia al cursore (S)"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M8.5 8 20 18M8.5 16 20 6"/></svg></button>
          <button class="btn sm ghost danger" id="delBtn" title="Elimina selezione (Canc)" disabled><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M9 7V5h6v2M7 7l1 13h8l1-13"/></svg></button>
        </div>
      </div>
    </div>

    <div class="props" id="props"><!-- contextual --></div>
  </div>

  <div class="tl">
    <div class="tlbar">
      <button class="btn sm" id="addTextBtn"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 5h14M12 5v14M9 19h6"/></svg>Testo</button>
      <label class="btn sm" for="audioFile"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V6l10-2v12"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/></svg>Suono / Musica</label>
      <button class="btn sm" id="stickerBtn"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/></svg>Emoji</button>
      <div class="sp"></div>
      <div class="zoom">
        <button class="btn sm ghost" id="zoomOut">−</button>Zoom<button class="btn sm ghost" id="zoomIn">+</button>
      </div>
    </div>
    <div class="tracks" id="tracks">
      <div class="tlinner" id="tlinner" style="--th:54px">
        <div class="ruler" id="ruler"></div>
        <div class="track" data-track="video"><div class="tlabel">Video</div></div>
        <div class="track" data-track="audio"><div class="tlabel">Audio</div></div>
        <div class="track" data-track="text"><div class="tlabel">Testo / Emoji</div></div>
        <div class="playhead" id="playheadEl" style="left:0"></div>
      </div>
    </div>
    <div class="note">Scorciatoie: <span class="kbd">Spazio</span> play · <span class="kbd">S</span> taglia · <span class="kbd">Canc</span> elimina · <span class="kbd">←/→</span> sposta cursore · <span class="kbd">Z</span> annulla</div>
  </div>
</div>

<input type="file" id="videoFile" accept="video/*">
<input type="file" id="audioFile" accept="audio/*">
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const uid=()=>Math.random().toString(36).slice(2,9);
const fmt=t=>{t=Math.max(0,t||0);const m=Math.floor(t/60),s=Math.floor(t%60),d=Math.floor((t*10)%10);return m+":"+String(s).padStart(2,"0")+"."+d;};
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),2200);}
const PALETTE=["#FBF4E6","#2B2724","#C7A45E","#A8636A","#AC3F3F","#3E7A54","#E0C488","#F3E9D6"];
const FONTS=[["Outfit","Outfit"],["Playfair Display","Playfair"],["Caveat","Caveat"]];
const PRESETS={none:"Nessuno",bw:"B/N",warm:"Caldo",cold:"Freddo",vivid:"Vivido",soft:"Soft"};
const EMOJIS=["🎄","🎅","⛄","🦌","🎁","✨","❄️","🔔","⭐","😍","🔥","👇","💥","🤍","🧡","🎬"];

/* ---------- state ---------- */
const S={
  src:null,              // {el,url,dur,w,h}
  segments:[],           // {id,in,out,eff:{bri,con,sat,scale,preset},fi,fo}
  audios:[],             // {id,name,buf,start,in,out,vol}
  overlays:[],           // {id,kind,text,x,y,size,color,font,bold,start,end}
  playhead:0, playing:false, sel:null, pps:48, undo:[]
};
let AC=null, master=null, exportDest=null, vidSrcNode=null, vidGain=null, playingSources=[];
let DL=null; // downloads capability (viewer only)
try{if(window.claude&&claude.use){claude.use("downloads").then(d=>{DL=d;}).catch(()=>{});}}catch(e){}

/* ---------- DOM ---------- */
const canvas=$("#canvas"), ctx=canvas.getContext("2d");
const stage=$("#stage"), tlinner=$("#tlinner"), ruler=$("#ruler"), playheadEl=$("#playheadEl");
const CW=canvas.width, CH=canvas.height;

/* ---------- totals / mapping ---------- */
const segDur=s=>s.out-s.in;
const total=()=>S.segments.reduce((a,s)=>a+segDur(s),0);
function segStart(i){let a=0;for(let k=0;k<i;k++)a+=segDur(S.segments[k]);return a;}
function locate(t){ // timeline t -> {i, src}
  let a=0;
  for(let i=0;i<S.segments.length;i++){const d=segDur(S.segments[i]);
    if(t<a+d||i===S.segments.length-1)return{i,src:S.segments[i].in+clamp(t-a,0,d)};a+=d;}
  return null;
}

/* ---------- undo ---------- */
function snapshot(){
  try{S.undo.push(JSON.stringify({segments:S.segments,overlays:S.overlays,
    audios:S.audios.map(a=>({id:a.id,name:a.name,start:a.start,in:a.in,out:a.out,vol:a.vol}))}));
  if(S.undo.length>40)S.undo.shift();$("#undoBtn").disabled=false;}catch(e){}
}
function undo(){
  if(!S.undo.length)return;const st=JSON.parse(S.undo.pop());
  S.segments=st.segments;S.overlays=st.overlays;
  const map={};S.audios.forEach(a=>map[a.id]=a.buf);
  S.audios=st.audios.map(a=>({...a,buf:map[a.id]})).filter(a=>a.buf);
  S.sel=null;$("#undoBtn").disabled=!S.undo.length;renderAll();drawFrame();
}

/* ---------- audio graph ---------- */
function ensureAudio(){
  if(AC)return;
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain();master.gain.value=1;master.connect(AC.destination);
  exportDest=AC.createMediaStreamDestination();master.connect(exportDest);
  if(S.src){vidSrcNode=AC.createMediaElementSource(S.src.el);vidGain=AC.createGain();
    vidSrcNode.connect(vidGain);vidGain.connect(master);}
}

/* ---------- load video ---------- */
function loadVideoFromUrl(url,label){
  const v=document.createElement("video");
  v.src=url;v.playsInline=true;v.preload="auto";v.crossOrigin="anonymous";
  v.addEventListener("loadedmetadata",()=>{
    S.src={el:v,url,dur:v.duration,w:v.videoWidth,h:v.videoHeight};
    if(!S.segments.length)S.segments=[newSeg(0,v.duration)];
    stage.classList.remove("empty");canvas.classList.remove("hidden");
    if(AC&&!vidSrcNode){try{vidSrcNode=AC.createMediaElementSource(v);vidGain=AC.createGain();
      vidSrcNode.connect(vidGain);vidGain.connect(master);}catch(e){}}
    S.playhead=0;seekTo(0);renderAll();select(null);
    if(label)toast(label);
  },{once:true});
  v.addEventListener("seeked",()=>{if(!S.playing)drawFrame();});
  v.load();
}
function newSeg(i,o){return{id:uid(),in:i,out:o,eff:{bri:100,con:100,sat:100,scale:100,preset:"none"},fi:0,fo:0};}

$("#videoFile").addEventListener("change",e=>{
  const f=e.target.files[0];if(!f)return;
  S.segments=[];S.audios=[];S.overlays=[];S.undo=[];$("#undoBtn").disabled=true;
  loadVideoFromUrl(URL.createObjectURL(f),"Video caricato");
});

/* ---------- audio load ---------- */
$("#audioFile").addEventListener("change",async e=>{
  const f=e.target.files[0];if(!f)return;ensureAudio();
  try{
    const buf=await AC.decodeAudioData(await f.arrayBuffer());
    snapshot();
    S.audios.push({id:uid(),name:f.name.replace(/\.[^.]+$/,"").slice(0,22),buf,
      start:S.playhead,in:0,out:buf.duration,vol:1});
    renderAll();select({kind:"audio",id:S.audios[S.audios.length-1].id});
    toast("Suono aggiunto");
  }catch(err){toast("Audio non supportato");}
  e.target.value="";
});

/* ---------- effects -> canvas filter ---------- */
function filterFor(eff){
  let f=`brightness(${eff.bri}%) contrast(${eff.con}%) saturate(${eff.sat}%)`;
  if(eff.preset==="bw")f+=" grayscale(1)";
  else if(eff.preset==="warm")f+=" sepia(.35) saturate(135%) hue-rotate(-8deg)";
  else if(eff.preset==="cold")f+=" saturate(115%) hue-rotate(10deg) brightness(102%)";
  else if(eff.preset==="vivid")f+=" saturate(160%) contrast(108%)";
  else if(eff.preset==="soft")f+=" brightness(104%) contrast(94%) saturate(96%)";
  return f;
}
/* opacity from fades + end-of-timeline */
function alphaAt(t,i,src){
  const seg=S.segments[i];let a=1;const st=segStart(i),d=segDur(seg);
  if(seg.fi>0)a=Math.min(a,clamp((t-st)/seg.fi,0,1));
  if(seg.fo>0)a=Math.min(a,clamp((st+d-t)/seg.fo,0,1));
  return a;
}

/* ---------- draw one frame ---------- */
function drawFrame(){
  ctx.clearRect(0,0,CW,CH);
  ctx.fillStyle="#141010";ctx.fillRect(0,0,CW,CH);
  const t=S.playhead,loc=S.src&&S.segments.length?locate(t):null;
  if(loc&&S.src){
    const seg=S.segments[loc.i],v=S.src.el;
    const a=alphaAt(t,loc.i,loc.src);
    ctx.save();ctx.globalAlpha=a;ctx.filter=filterFor(seg.eff);
    // cover-fit 9:16
    const sc=Math.max(CW/S.src.w,CH/S.src.h)*(seg.eff.scale/100);
    const dw=S.src.w*sc,dh=S.src.h*sc;
    ctx.drawImage(v,(CW-dw)/2,(CH-dh)/2,dw,dh);
    ctx.restore();ctx.filter="none";ctx.globalAlpha=1;
  }
  // overlays
  for(const o of S.overlays){
    if(t<o.start||t>o.end)continue;
    ctx.save();
    const px=o.x*CW,py=o.y*CH,fs=o.size/100*CH*0.1+10;
    ctx.font=`${o.bold?"800":"600"} ${fs}px ${o.font},sans-serif`;
    ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillStyle=o.color;
    ctx.shadowColor="rgba(0,0,0,.45)";ctx.shadowBlur=fs*0.18;ctx.shadowOffsetY=fs*0.04;
    const lines=(o.text||"").split("\n");const lh=fs*1.15;
    lines.forEach((ln,k)=>ctx.fillText(ln,px,py+(k-(lines.length-1)/2)*lh));
    ctx.restore();
    if(S.sel&&S.sel.kind==="overlay"&&S.sel.id===o.id){
      ctx.save();ctx.strokeStyle="#E0C488";ctx.lineWidth=2;ctx.setLineDash([6,5]);
      const w=CW*0.9;ctx.strokeRect(px-w/2,py-fs,w,fs*2*(o.text.split("\n").length));ctx.restore();
    }
  }
}

/* ---------- playback ---------- */
let raf=null,lastClock=0;
function stopSources(){playingSources.forEach(s=>{try{s.stop()}catch(e){}});playingSources=[];}
function scheduleAudio(fromT){
  if(!AC)return;stopSources();
  const now=AC.currentTime;
  for(const c of S.audios){
    const clipDur=c.out-c.in, endT=c.start+clipDur;
    if(endT<=fromT)continue;
    let offset=c.in,when=now+(c.start-fromT),dur=clipDur;
    if(c.start<fromT){offset=c.in+(fromT-c.start);when=now;dur=c.out-offset;}
    if(dur<=0)continue;
    const src=AC.createBufferSource();src.buffer=c.buf;
    const g=AC.createGain();g.gain.value=c.vol;src.connect(g);g.connect(master);
    try{src.start(Math.max(now,when),offset,dur);playingSources.push(src);}catch(e){}
  }
}
function seekVideoForPlayhead(){
  if(!S.src)return;const loc=locate(S.playhead);if(loc)S.src.el.currentTime=loc.src;
}
async function play(){
  if(!S.src||!S.segments.length||S.playing)return;
  ensureAudio();if(AC.state==="suspended")await AC.resume();
  if(S.playhead>=total()-0.02)S.playhead=0;
  S.playing=true;$("#playIco").innerHTML='<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>';
  seekVideoForPlayhead();
  try{await S.src.el.play();}catch(e){}
  scheduleAudio(S.playhead);
  lastClock=performance.now();loop();
}
function pause(){
  S.playing=false;$("#playIco").innerHTML='<path d="M8 5v14l11-7z"/>';
  if(S.src)S.src.el.pause();stopSources();if(raf)cancelAnimationFrame(raf);
}
function loop(){
  if(!S.playing)return;
  const now=performance.now(),dt=(now-lastClock)/1000;lastClock=now;
  const loc=locate(S.playhead);
  if(loc&&S.src){
    const seg=S.segments[loc.i];
    // advance by video clock within segment for A/V sync
    S.playhead=segStart(loc.i)+clamp(S.src.el.currentTime-seg.in,0,segDur(seg));
    if(S.src.el.currentTime>=seg.out-0.03||S.src.el.paused){
      // move to next segment
      const ns=loc.i+1;
      if(ns<S.segments.length){S.src.el.currentTime=S.segments[ns].in;S.playhead=segStart(ns)+0.001;
        if(S.src.el.paused)S.src.el.play().catch(()=>{});}
      else{S.playhead=total();pause();updatePlayhead();drawFrame();return;}
    }
  }
  drawFrame();updatePlayhead();
  raf=requestAnimationFrame(loop);
}
function seekTo(t){
  S.playhead=clamp(t,0,total());
  if(S.src){const loc=locate(S.playhead);if(loc)S.src.el.currentTime=loc.src;}
  if(S.playing){scheduleAudio(S.playhead);}
  updatePlayhead();if(!S.playing)drawFrame();
}
$("#playBtn").addEventListener("click",()=>S.playing?pause():play());

/* ---------- timeline render ---------- */
function updatePlayhead(){
  playheadEl.style.left=(S.playhead*S.pps)+"px";
  $("#timeLbl").textContent=fmt(S.playhead)+" / "+fmt(total());
  // auto-scroll
  const tr=$("#tracks"),x=S.playhead*S.pps;
  if(x<tr.scrollLeft+40)tr.scrollLeft=x-40;
  else if(x>tr.scrollLeft+tr.clientWidth-40)tr.scrollLeft=x-tr.clientWidth+40;
}
function renderRuler(){
  const T=Math.max(total(),1);tlinner.style.width=Math.max(T*S.pps+20,$("#tracks").clientWidth)+"px";
  ruler.innerHTML="";
  let step=1;if(S.pps<30)step=5;else if(S.pps<60)step=2;else if(S.pps>120)step=.5;
  for(let t=0;t<=T+0.001;t+=step){const d=document.createElement("div");d.className="tick";
    d.style.left=(t*S.pps)+"px";d.textContent=fmt(t).replace(/\.\d$/,"");ruler.appendChild(d);}
}
function clipEl(cls,left,width,label,sel,data){
  const el=document.createElement("div");el.className="clip "+cls+(sel?" sel":"");
  el.style.left=left+"px";el.style.width=Math.max(width,10)+"px";
  el.innerHTML=`<div class="h l"></div><div class="cl-t">${label}</div><div class="h r"></div>`;
  Object.assign(el.dataset,data);return el;
}
function renderTracks(){
  $$(".clip").forEach(c=>c.remove());
  const vt=$('[data-track="video"]'),at=$('[data-track="audio"]'),tt=$('[data-track="text"]');
  S.segments.forEach((s,i)=>{
    const el=clipEl("vid",segStart(i)*S.pps,segDur(s)*S.pps,
      "▦ "+fmt(segDur(s)),S.sel&&S.sel.kind==="segment"&&S.sel.id===s.id,{kind:"segment",id:s.id});
    vt.appendChild(el);
  });
  S.audios.forEach(a=>{
    const el=clipEl("aud",a.start*S.pps,(a.out-a.in)*S.pps,"♪ "+a.name,
      S.sel&&S.sel.kind==="audio"&&S.sel.id===a.id,{kind:"audio",id:a.id});
    at.appendChild(el);
  });
  S.overlays.forEach(o=>{
    const el=clipEl("txt",o.start*S.pps,(o.end-o.start)*S.pps,(o.kind==="emoji"?o.text:"T "+(o.text||"").replace(/\n/g," ")),
      S.sel&&S.sel.kind==="overlay"&&S.sel.id===o.id,{kind:"overlay",id:o.id});
    tt.appendChild(el);
  });
}
function renderAll(){renderRuler();renderTracks();updatePlayhead();renderProps();refreshButtons();}
function refreshButtons(){
  $("#delBtn").disabled=!S.sel;
  $("#splitBtn").disabled=!S.src||!S.segments.length;
}

/* ---------- selection ---------- */
function select(sel){S.sel=sel;renderTracks();renderProps();refreshButtons();drawFrame();}
function getSelObj(){
  if(!S.sel)return null;
  if(S.sel.kind==="segment")return S.segments.find(s=>s.id===S.sel.id);
  if(S.sel.kind==="audio")return S.audios.find(a=>a.id===S.sel.id);
  if(S.sel.kind==="overlay")return S.overlays.find(o=>o.id===S.sel.id);
}

/* ---------- edits ---------- */
function splitAt(t){
  const loc=locate(t);if(!loc)return;const seg=S.segments[loc.i];
  const srcT=loc.src;if(srcT<=seg.in+0.05||srcT>=seg.out-0.05)return;
  snapshot();
  const b=newSeg(srcT,seg.out);b.eff={...seg.eff};
  seg.out=srcT;seg.fo=0;b.fi=0;
  S.segments.splice(loc.i+1,0,b);
  renderAll();toast("Tagliato");
}
function delSel(){
  if(!S.sel)return;snapshot();
  if(S.sel.kind==="segment"){
    if(S.segments.length<=1){toast("Serve almeno un clip video");S.undo.pop();return;}
    S.segments=S.segments.filter(s=>s.id!==S.sel.id);
  }else if(S.sel.kind==="audio")S.audios=S.audios.filter(a=>a.id!==S.sel.id);
  else if(S.sel.kind==="overlay")S.overlays=S.overlays.filter(o=>o.id!==S.sel.id);
  S.sel=null;S.playhead=clamp(S.playhead,0,total());renderAll();seekTo(S.playhead);toast("Eliminato");
}
$("#splitBtn").addEventListener("click",()=>splitAt(S.playhead));
$("#delBtn").addEventListener("click",delSel);
$("#undoBtn").addEventListener("click",undo);

/* add text / emoji */
function addOverlay(kind,text){
  if(!S.src){toast("Carica prima un video");return;}
  snapshot();
  const o={id:uid(),kind,text,x:0.5,y:kind==="emoji"?0.45:0.8,
    size:kind==="emoji"?60:34,color:kind==="emoji"?"#fff":"#FBF4E6",
    font:"Outfit",bold:true,start:S.playhead,end:Math.min(S.playhead+2.5,total())};
  if(o.end-o.start<0.5)o.start=Math.max(0,o.end-2.5);
  S.overlays.push(o);renderAll();select({kind:"overlay",id:o.id});
}
$("#addTextBtn").addEventListener("click",()=>addOverlay("text","Nuovo testo"));
$("#stickerBtn").addEventListener("click",()=>openEmoji());

/* ---------- properties panel ---------- */
function renderProps(){
  const p=$("#props"),o=getSelObj();
  if(!o){p.innerHTML=`<h3>Proprietà</h3><p class="hint">Seleziona un elemento sulla timeline per modificarlo.<br><br>
    • <b>Video</b>: taglia con <span class="kbd">S</span>, regola effetti e dissolvenze.<br>
    • <b>Suono/Musica</b>: carica un file e trascinalo sulla traccia.<br>
    • <b>Testo/Emoji</b>: aggiungi e trascina sul video per posizionarlo.</p>`;return;}
  if(S.sel.kind==="segment")renderSegProps(p,o);
  else if(S.sel.kind==="audio")renderAudioProps(p,o);
  else renderOverlayProps(p,o);
}
function slider(label,val,min,max,unit,oninput,step){
  const f=document.createElement("div");f.className="field";
  f.innerHTML=`<label>${label} <span class="val">${val}${unit||""}</span></label>`;
  const r=document.createElement("input");r.type="range";r.min=min;r.max=max;r.value=val;r.step=step||1;
  r.addEventListener("input",()=>{f.querySelector(".val").textContent=r.value+(unit||"");oninput(+r.value);});
  f.appendChild(r);return f;
}
function renderSegProps(p,s){
  p.innerHTML=`<h3>✂️ Clip video · ${fmt(segDur(s))}</h3>`;
  const chips=document.createElement("div");chips.className="field";
  chips.innerHTML=`<label>Look</label>`;const cw=document.createElement("div");cw.className="chips";
  Object.entries(PRESETS).forEach(([k,v])=>{const c=document.createElement("button");
    c.className="chip"+(s.eff.preset===k?" on":"");c.textContent=v;
    c.onclick=()=>{s.eff.preset=k;renderProps();drawFrame();};cw.appendChild(c);});
  chips.appendChild(cw);p.appendChild(chips);
  p.appendChild(slider("Luminosità",s.eff.bri,40,180,"%",v=>{s.eff.bri=v;drawFrame();}));
  p.appendChild(slider("Contrasto",s.eff.con,40,180,"%",v=>{s.eff.con=v;drawFrame();}));
  p.appendChild(slider("Saturazione",s.eff.sat,0,220,"%",v=>{s.eff.sat=v;drawFrame();}));
  p.appendChild(slider("Zoom",s.eff.scale,100,180,"%",v=>{s.eff.scale=v;drawFrame();}));
  p.appendChild(slider("Dissolvenza in entrata",s.fi,0,2,"s",v=>{s.fi=v;drawFrame();},0.1));
  p.appendChild(slider("Dissolvenza in uscita",s.fo,0,2,"s",v=>{s.fo=v;drawFrame();},0.1));
  const row=document.createElement("div");row.className="row";
  const b1=document.createElement("button");b1.className="btn sm ghost";b1.textContent="Reset effetti";
  b1.onclick=()=>{snapshot();s.eff={bri:100,con:100,sat:100,scale:100,preset:"none"};s.fi=0;s.fo=0;renderProps();drawFrame();};
  row.appendChild(b1);p.appendChild(row);
}
function renderAudioProps(p,a){
  p.innerHTML=`<h3>🎵 ${a.name}</h3>`;
  p.appendChild(slider("Volume",Math.round(a.vol*100),0,150,"%",v=>{a.vol=v/100;}));
  const f=document.createElement("div");f.className="field";
  f.innerHTML=`<label>Inizio sulla timeline</label>`;
  const n=document.createElement("input");n.type="number";n.step="0.1";n.min="0";n.value=a.start.toFixed(1);
  n.onchange=()=>{snapshot();a.start=clamp(+n.value,0,Math.max(0,total()-0.2));renderTracks();};
  f.appendChild(n);p.appendChild(f);
  const row=document.createElement("div");row.className="row";
  const b=document.createElement("button");b.className="btn sm";b.textContent="Allinea al cursore";
  b.onclick=()=>{snapshot();a.start=S.playhead;renderTracks();};row.appendChild(b);
  p.appendChild(row);
  const note=document.createElement("p");note.className="hint";
  note.innerHTML="Trascina il blocco sulla traccia per spostarlo; i bordi per tagliarlo.";
  p.appendChild(note);
}
function renderOverlayProps(p,o){
  p.innerHTML=`<h3>${o.kind==="emoji"?"😊 Emoji":"🔤 Testo"}</h3>`;
  if(o.kind!=="emoji"){
    const f=document.createElement("div");f.className="field";f.innerHTML=`<label>Testo</label>`;
    const ta=document.createElement("textarea");ta.value=o.text;
    ta.oninput=()=>{o.text=ta.value;drawFrame();renderTracks();};f.appendChild(ta);p.appendChild(f);
    const ff=document.createElement("div");ff.className="field";ff.innerHTML=`<label>Font</label>`;
    const sel=document.createElement("select");FONTS.forEach(([n,v])=>{const op=document.createElement("option");
      op.value=v;op.textContent=n;if(o.font===v)op.selected=true;sel.appendChild(op);});
    sel.onchange=()=>{o.font=sel.value;drawFrame();};ff.appendChild(sel);p.appendChild(ff);
    const cf=document.createElement("div");cf.className="field";cf.innerHTML=`<label>Colore</label>`;
    const sw=document.createElement("div");sw.className="swatches";
    PALETTE.forEach(c=>{const b=document.createElement("button");b.className="sw"+(o.color===c?" on":"");
      b.style.background=c;b.onclick=()=>{o.color=c;renderProps();drawFrame();};sw.appendChild(b);});
    cf.appendChild(sw);p.appendChild(cf);
    const tg=document.createElement("div");tg.className="field";tg.innerHTML=`<label>Stile</label>`;
    const tog=document.createElement("div");tog.className="toggle";
    const g1=document.createElement("button");g1.textContent="Grassetto";g1.className=o.bold?"on":"";
    const g2=document.createElement("button");g2.textContent="Normale";g2.className=o.bold?"":"on";
    g1.onclick=()=>{o.bold=true;renderProps();drawFrame();};
    g2.onclick=()=>{o.bold=false;renderProps();drawFrame();};
    tog.appendChild(g1);tog.appendChild(g2);tg.appendChild(tog);p.appendChild(tg);
  }
  p.appendChild(slider("Dimensione",o.size,12,120,"",v=>{o.size=v;drawFrame();}));
  const dur=document.createElement("div");dur.className="row";
  const b1=document.createElement("button");b1.className="btn sm ghost";b1.textContent="Inizio = cursore";
  b1.onclick=()=>{snapshot();o.start=clamp(S.playhead,0,o.end-0.3);renderTracks();drawFrame();};
  const b2=document.createElement("button");b2.className="btn sm ghost";b2.textContent="Fine = cursore";
  b2.onclick=()=>{snapshot();o.end=clamp(S.playhead,o.start+0.3,total());renderTracks();drawFrame();};
  dur.appendChild(b1);dur.appendChild(b2);p.appendChild(dur);
  const note=document.createElement("p");note.className="hint";
  note.innerHTML="Trascina direttamente sul video per posizionarlo.";p.appendChild(note);
}

/* ---------- timeline pointer (select / move / trim / scrub) ---------- */
let drag=null;
$("#tracks").addEventListener("pointerdown",e=>{
  const tr=$("#tracks");const rect=tlinner.getBoundingClientRect();
  const x=e.clientX-rect.left;const t=x/S.pps;
  const clip=e.target.closest(".clip");
  if(!clip){ // scrub on ruler/empty
    pause();seekTo(t);select(null);
    drag={mode:"scrub"};tr.setPointerCapture(e.pointerId);return;
  }
  const kind=clip.dataset.kind,id=clip.dataset.id;select({kind,id});
  const handle=e.target.classList.contains("h")?(e.target.classList.contains("l")?"l":"r"):null;
  const obj=getSelObj();snapshot();
  drag={mode:handle?"trim":"move",handle,kind,id,startX:e.clientX,t0:t,obj,
    orig:JSON.parse(JSON.stringify(kind==="segment"?{in:obj.in,out:obj.out}:
      kind==="audio"?{start:obj.start,in:obj.in,out:obj.out}:{start:obj.start,end:obj.end}))};
  tr.setPointerCapture(e.pointerId);
});
$("#tracks").addEventListener("pointermove",e=>{
  if(!drag)return;const rect=tlinner.getBoundingClientRect();
  const t=(e.clientX-rect.left)/S.pps, dt=(e.clientX-drag.startX)/S.pps;
  if(drag.mode==="scrub"){seekTo(t);return;}
  const o=drag.obj,og=drag.orig;
  if(drag.kind==="segment"){
    // trim within source bounds
    if(drag.handle==="l")o.in=clamp(og.in+dt,0,o.out-0.1);
    else if(drag.handle==="r")o.out=clamp(og.out+dt,o.in+0.1,S.src.dur);
    renderTracks();drawFrame();
  }else if(drag.kind==="audio"){
    if(drag.mode==="move")o.start=Math.max(0,og.start+dt);
    else if(drag.handle==="l")o.in=clamp(og.in+dt,0,o.out-0.1);
    else o.out=clamp(og.out+dt,o.in+0.1,o.buf.duration);
    renderTracks();
  }else{ // overlay
    if(drag.mode==="move"){const d=og.end-og.start;o.start=Math.max(0,og.start+dt);o.end=o.start+d;}
    else if(drag.handle==="l")o.start=clamp(og.start+dt,0,o.end-0.3);
    else o.end=clamp(og.end+dt,o.start+0.3,total()+30);
    renderTracks();
  }
});
$("#tracks").addEventListener("pointerup",e=>{
  if(drag&&drag.mode!=="scrub"){renderRuler();renderProps();seekTo(S.playhead);}
  else if(drag&&drag.mode==="scrub"){ /* keep */ }
  drag=null;
});

/* ---------- canvas pointer (drag overlay position) ---------- */
let odrag=null;
canvas.addEventListener("pointerdown",e=>{
  const r=canvas.getBoundingClientRect();const x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
  // hit test active overlays (topmost last)
  let hit=null;
  for(let i=S.overlays.length-1;i>=0;i--){const o=S.overlays[i];
    if(S.playhead<o.start||S.playhead>o.end)continue;
    const fs=(o.size/100*CH*0.1+10)/CH; const w=0.46,h=fs*1.3*Math.max(1,(o.text||"").split("\n").length);
    if(Math.abs(x-o.x)<w&&Math.abs(y-o.y)<h){hit=o;break;}
  }
  if(hit){select({kind:"overlay",id:hit.id});snapshot();
    odrag={o:hit,dx:x-hit.x,dy:y-hit.y};canvas.setPointerCapture(e.pointerId);canvas.style.cursor="grabbing";}
});
canvas.addEventListener("pointermove",e=>{
  if(!odrag)return;const r=canvas.getBoundingClientRect();
  odrag.o.x=clamp((e.clientX-r.left)/r.width-odrag.dx,0.05,0.95);
  odrag.o.y=clamp((e.clientY-r.top)/r.height-odrag.dy,0.05,0.95);
  drawFrame();
});
canvas.addEventListener("pointerup",e=>{if(odrag){odrag=null;canvas.style.cursor="grab";renderProps();}});

/* ---------- zoom ---------- */
$("#zoomIn").addEventListener("click",()=>{S.pps=clamp(S.pps*1.3,12,240);renderAll();});
$("#zoomOut").addEventListener("click",()=>{S.pps=clamp(S.pps/1.3,12,240);renderAll();});

/* ---------- keyboard ---------- */
document.addEventListener("keydown",e=>{
  if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
  if(e.code==="Space"){e.preventDefault();S.playing?pause():play();}
  else if(e.key==="s"||e.key==="S"){splitAt(S.playhead);}
  else if(e.key==="Delete"||e.key==="Backspace"){if(S.sel){e.preventDefault();delSel();}}
  else if(e.key==="ArrowLeft"){pause();seekTo(S.playhead-(e.shiftKey?1:0.1));}
  else if(e.key==="ArrowRight"){pause();seekTo(S.playhead+(e.shiftKey?1:0.1));}
  else if(e.key==="z"||e.key==="Z"){undo();}
});

function openEmoji(){

  const m=document.createElement("div");m.className="modal";
  m.innerHTML=`<div class="card"><h2>Scegli un'emoji</h2>
    <div class="chips" style="font-size:26px">${EMOJIS.map(e=>`<button class="chip" data-e="${e}" style="font-size:24px">${e}</button>`).join("")}</div>
    <div class="row" style="margin-top:14px"><button class="btn ghost" data-x>Chiudi</button></div></div>`;
  m.addEventListener("click",ev=>{
    if(ev.target===m||ev.target.hasAttribute("data-x"))m.remove();
    const b=ev.target.closest("[data-e]");if(b){addOverlay("emoji",b.dataset.e);m.remove();}
  });
  document.body.appendChild(m);
}

/* ---------- export ---------- */

  return{
    format:"verace-studio-plan/1",

    totalDuration:+total().toFixed(2),
    segments:S.segments.map((s,i)=>({order:i,sourceIn:+s.in.toFixed(2),sourceOut:+s.out.toFixed(2),

      <button class="btn" id="exVideo"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15V3M8 7l4-4 4 4M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>Scarica video adesso (.webm)</button>
    </div>
    <p class="note">Il piano contiene tutti i tagli, effetti, testi e tempi: incollamelo in chat e ti rendo il reel finale in alta qualità con i tuoi font.<br>
    Lo <b>scarico diretto</b> funziona quando apri questo editor come file sul tuo computer; dentro l'anteprima qui potrebbe essere bloccato.</p>
    <div id="exArea"></div>
    <div class="row" style="margin-top:10px"><button class="btn ghost" data-x>Chiudi</button></div></div>`;
  m.addEventListener("click",ev=>{if(ev.target===m||ev.target.hasAttribute("data-x"))if(!recording){m.remove();}});
  m.querySelector("#exPlan").onclick=()=>showPlan(m);
  m.querySelector("#exVideo").onclick=()=>recordVideo(m);
  document.body.appendChild(m);
}
function showPlan(m){
  const plan=JSON.stringify(buildPlan(),null,2);
  const area=m.querySelector("#exArea");
  area.innerHTML=`<pre id="planPre">${plan.replace(/</g,"&lt;")}</pre>
    <button class="btn accent sm" id="copyPlan">Copia negli appunti</button>`;
  m.querySelector("#copyPlan").onclick=async()=>{
    try{await navigator.clipboard.writeText(plan);toast("Piano copiato! Incollalo in chat.");}
    catch(e){const pre=m.querySelector("#planPre");const r=document.createRange();r.selectNodeContents(pre);
      const sel=getSelection();sel.removeAllRanges();sel.addRange(r);toast("Selezionato: premi Cmd/Ctrl+C");}
  };
}
let recording=false;
async function recordVideo(m){
  if(recording)return;const area=m.querySelector("#exArea");
  if(typeof MediaRecorder==="undefined"){area.innerHTML=`<p class="note">Il tuo browser non supporta la registrazione. Usa «Copia il piano».</p>`;return;}
  ensureAudio();if(AC.state==="suspended")await AC.resume();
  const types=["video/webm;codecs=vp9,opus","video/webm;codecs=vp8,opus","video/webm","video/mp4"];
  const mime=types.find(t=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))||"";
  const vstream=canvas.captureStream(30);
  const stream=new MediaStream([...vstream.getVideoTracks(),...exportDest.stream.getAudioTracks()]);
  let rec;try{rec=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:6000000}:undefined);}
  catch(e){area.innerHTML=`<p class="note">Registrazione non disponibile qui. Usa «Copia il piano».</p>`;return;}
  const chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
  recording=true;
  area.innerHTML=`<p class="note" id="exMsg">Registrazione in corso… <b id="exPct">0%</b> (resta su questa scheda)</p>`;
  pause();S.playhead=0;seekTo(0);
  rec.onstop=async()=>{
    recording=false;const blob=new Blob(chunks,{type:mime.split(";")[0]||"video/webm"});
    const ext=mime.includes("mp4")?"mp4":"webm";const fn="verace-reel."+ext;
    const sizeMB=(blob.size/1048576).toFixed(1);
    if(DL){
      try{await DL.save({filename:fn,data:blob});
        area.innerHTML=`<p class="note">✓ Video salvato (${sizeMB} MB). Per la qualità massima 1080×1920 con i tuoi font, usa «Copia il piano».</p>`;return;
      }catch(err){
        if(err&&err.code==="declined"){area.innerHTML=`<p class="note">Salvataggio annullato.</p>`;return;}
      }
    }
    const url=URL.createObjectURL(blob);
    try{const a=document.createElement("a");a.href=url;a.download=fn;document.body.appendChild(a);a.click();a.remove();}catch(e){}
    area.innerHTML=`<p class="note">Video pronto (${sizeMB} MB).
      <a href="${url}" download="${fn}" class="btn accent sm" style="margin-top:8px">Scarica</a><br>
      Se non parte, apri l'editor come file sul tuo computer, oppure usa «Copia il piano».</p>`;
  };
  rec.start(200);
  await play();
  const tot=total();
  const watch=()=>{
    const pct=Math.min(100,Math.round(S.playhead/tot*100));
    const pe=m.querySelector("#exPct");if(pe)pe.textContent=pct+"%";
    if(!S.playing||S.playhead>=tot-0.05){try{rec.stop()}catch(e){}return;}
    requestAnimationFrame(watch);
  };
  requestAnimationFrame(watch);
}
$("#exportBtn").addEventListener("click",openExport);

/* ---------- boot: load demo ---------- */
function b64ToBlobUrl(b64,type){
  const bin=atob(b64);const len=bin.length;const bytes=new Uint8Array(len);
  for(let i=0;i<len;i++)bytes[i]=bin.charCodeAt(i);
  return URL.createObjectURL(new Blob([bytes],{type}));
}
(function boot(){
  renderAll();drawFrame();
  try{if(DEMO_B64&&DEMO_B64.length>100){loadVideoFromUrl(b64ToBlobUrl(DEMO_B64,"video/mp4"),"Clip demo caricata — prova a modificarla");}}
  catch(e){}
})();
</script>
